# Prometheus configuration for EchoWright services

global:
  scrape_interval: 15s  # How often to scrape targets
  evaluation_interval: 15s  # How often to evaluate rules
  scrape_timeout: 10s

# Scrape configurations
scrape_configs:
  # API Gateway metrics
  - job_name: 'api_gateway'
    static_configs:
      - targets: ['api_gateway:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # LLM Gateway metrics
  - job_name: 'llm_gateway'
    static_configs:
      - targets: ['llm_gateway:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Context Service metrics
  - job_name: 'context_service'
    static_configs:
      - targets: ['context_service:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # TTS Service metrics
  - job_name: 'tts_service'
    static_configs:
      - targets: ['tts_service:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Alerting rules would go here
rule_files:
  # - 'alerts.yml'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - 'alertmanager:9093'