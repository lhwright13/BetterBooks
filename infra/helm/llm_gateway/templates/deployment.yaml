apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-gateway.fullname" . }}
  labels:
    app: {{ include "llm-gateway.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "llm-gateway.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "llm-gateway.name" . }}
    spec:
      containers:
        - name: llm-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8000
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-key
                  key: key
