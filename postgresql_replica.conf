# PostgreSQL Read Replica Configuration for EchoWright
# Optimized for read-only operations and hot standby

# PostgreSQL Replica Configuration  
# Base configuration is already provided by the image

# Hot Standby Settings
hot_standby = on                       # Enable read-only queries on standby
max_standby_archive_delay = 30s        # Max delay before canceling queries
max_standby_streaming_delay = 30s      # Max delay for streaming queries
hot_standby_feedback = on              # Send feedback to primary
wal_receiver_status_interval = 10s     # Status update frequency
wal_retrieve_retry_interval = 5s       # Retry interval for WAL retrieval

# Connection Settings
listen_addresses = '*'
max_connections = 150                  # Fewer connections for read-only
superuser_reserved_connections = 3

# Performance Settings (Read-optimized)
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 16MB                        # More memory for complex read queries
maintenance_work_mem = 128MB
random_page_cost = 1.1
effective_io_concurrency = 200

# Query Performance
default_statistics_target = 100
constraint_exclusion = partition
enable_partitionwise_join = on
enable_partitionwise_aggregate = on

# Logging
log_line_prefix = 'REPLICA %m [%p] %q%u@%d '
log_min_duration_statement = 1000      # Log slow queries
log_connections = on
log_disconnections = on

# Read-only enforcement (safety measure)
default_transaction_read_only = on
transaction_read_only = on

# Autovacuum (lighter for read replica)
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 60s

# WAL Settings
wal_level = replica
max_wal_senders = 0                    # No WAL senders needed on replica

# Archive recovery (for failover scenarios)
restore_command = 'cp /var/lib/postgresql/archive/%f %p'

# Background processes optimization for read workload
max_worker_processes = 6
max_parallel_workers = 6
max_parallel_workers_per_gather = 3
max_parallel_maintenance_workers = 2