<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BetterBooks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>BetterBooks</h1>
      <p class="app-subtitle">AI-powered audiobook companion</p>
    </header>
    
    <main class="app-main">
      <!-- Audio Player Section -->
      <section class="player-card">
        <div class="card-header">
          <h2>🎧 Now Playing</h2>
        </div>
        <div class="card-content">
          <div class="book-selector">
            <select id="bookSelect" class="modern-select">
              <option value="">Choose your audiobook...</option>
            </select>
            <div id="chapterSelect" class="chapter-selector" style="display: none;">
              <select id="chapterDropdown" class="modern-select">
                <option value="">Choose a chapter...</option>
              </select>
            </div>
          </div>
          
          <div class="player-wrapper">
            <audio id="audioPlayer" controls></audio>
          </div>
          
          <div id="contextStatus" class="context-badge">
            ❌ No context - select a book to ask questions
          </div>
        </div>
      </section>

      <!-- Chat Section -->
      <section class="chat-card">
        <div class="card-header">
          <h2>💬 Ask About Your Story</h2>
        </div>
        <div class="card-content">
          <div class="chat-controls">
            <div class="persona-selector">
              <label for="configSelect">AI Persona:</label>
              <select id="configSelect" class="modern-select"></select>
            </div>
          </div>
          
          <div class="input-section">
            <textarea id="prompt" placeholder="What's happening in this scene? Who are these characters? Ask me anything about your story..."></textarea>
            <div class="button-group">
              <button id="sendText" class="primary-button">
                <span>Send</span>
              </button>
              <button id="startVoice" class="secondary-button">
                <span>Speak</span>
              </button>
            </div>
          </div>
          
          <div id="response" class="response-area"></div>
        </div>
      </section>
    </main>
  </div>
  
  <!-- Hidden elements for book management (kept for functionality) -->
  <div style="display: none;">
    <input type="file" id="singleBookFile" accept=".mp3" />
    <button id="uploadSingle">Upload Single Book</button>
    <input type="text" id="bookName" placeholder="Book name" />
    <input type="file" id="chapterFiles" accept=".mp3" multiple />
    <button id="uploadChapters">Upload Chapters</button>
    <div id="booksList"></div>
    <button id="refreshBooks">Refresh List</button>
    <div id="playerStatus"></div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
