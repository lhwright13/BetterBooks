name: echowright_rebuilt
description: EchoWright - Rebuilt with API-driven architecture
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Essential UI
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  
  # Networking & API
  http: ^1.1.0
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Audio & Voice
  audioplayers: ^6.5.0
  # speech_to_text: ^6.3.0  # Temporarily disabled due to iOS Swift header issues
  # permission_handler: ^11.0.1  # Will add back when needed
  # flutter_sound: ^9.2.13  # Will add back when needed
  # flutter_tts: ^3.8.3  # Will add back when needed
  
  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^5.0.0
  
  # Storage & Downloads
  path_provider: ^2.1.1
  dio: ^5.3.2
  sqflite: ^2.3.0
  
  # UI & Interactions
  lottie: ^2.6.0
  url_launcher: ^6.2.1
  share_plus: ^7.2.1
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # In-App Purchases
  in_app_purchase: ^3.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/