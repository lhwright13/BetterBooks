name: echowright
description: EchoWright - AI-powered audiobook companion with interactive personas
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  audioplayers: ^6.5.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  # Authentication packages
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^5.0.0
  flutter_secure_storage: ^9.0.0
  url_launcher: ^6.2.1
  crypto: ^3.0.3
  # Payment and subscription packages
  in_app_purchase: ^3.1.0
  in_app_purchase_storekit: ^0.3.0
  in_app_purchase_android: ^0.3.0
  share_plus: ^7.2.0
  permission_handler: ^11.0.0
  connectivity_plus: ^5.0.0
  # Audio and speech packages
  # speech_to_text: ^6.6.0  # Temporarily disabled for build issue
  # Database for offline support
  sqflite: ^2.3.0
  # File system and download packages
  path_provider: ^2.1.1
  dio: ^5.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  shaders:
    - shaders/ripple.frag
