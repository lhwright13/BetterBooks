                        contentEl.innerHTML = escapeHtml(responseText);

                        // Add both user message and assistant response to history
                        chatHistory.push({ role: 'user', content: message });
                        chatHistory.push({ role: 'assistant', content: responseText });
                    }
                } else {
                    const data = await res.json();
                    contentEl.innerHTML = `Sorry, I encountered an error: ${escapeHtml(data.detail || 'Unknown error')}`;
                }
            } catch (err) {
                console.error('Chat error:', err);
                const contentEl = document.getElementById(`content-${messageId}`);
                if (contentEl) {
                    contentEl.innerHTML = "Sorry, I couldn't connect to the AI service. Make sure the backend is running.";
                }
            }

            sendBtn.disabled = false;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function handleStreamingResponse(response, contentEl, userMessage, personaName) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullContent = '';
            let isFirstChunk = true;

            try {
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));

                                if (data.error) {
                                    contentEl.innerHTML = `Error: ${escapeHtml(data.error)}`;
                                    return;
                                }

                                if (data.content) {
                                    if (isFirstChunk) {
                                        // Clear the typing indicator on first content
                                        contentEl.innerHTML = '';
                                        isFirstChunk = false;
                                    }
                                    fullContent += data.content;
                                    contentEl.innerHTML = escapeHtml(fullContent);

                                    // Auto-scroll as content streams in
                                    const messagesDiv = document.getElementById('chat-messages');
                                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                                }

                                if (data.done) {
                                    // Streaming complete - add to history
                                    if (fullContent) {
                                        chatHistory.push({ role: 'user', content: userMessage });
                                        chatHistory.push({ role: 'assistant', content: fullContent });
                                    }
                                }
                            } catch (parseErr) {
                                // Ignore parse errors for incomplete JSON chunks
                            }
                        }
                    }
                }

                // Handle case where streaming ends without explicit done signal
                if (fullContent && !chatHistory.find(h => h.content === fullContent && h.role === 'assistant')) {
                    chatHistory.push({ role: 'user', content: userMessage });
                    chatHistory.push({ role: 'assistant', content: fullContent });
                }

                // If no content was received, show error
                if (!fullContent && isFirstChunk) {
                    contentEl.innerHTML = 'No response received from AI.';
                }

            } catch (streamErr) {
                console.error('Streaming error:', streamErr);
                if (isFirstChunk) {
                    contentEl.innerHTML = 'Error reading streaming response.';
                }
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
