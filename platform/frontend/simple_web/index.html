<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetterBooks - AI Audiobook Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 120px; /* Space for mini player */
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #e94560;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .credits-badge {
            background: #e94560;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .nav-tab {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .nav-tab:hover {
            background: rgba(255,255,255,0.2);
        }

        .nav-tab.active {
            background: #e94560;
        }

        /* Pages */
        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* Auth Page */
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            background: rgba(255,255,255,0.05);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .auth-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #e94560;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #e94560;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-primary:hover {
            background: #d63550;
        }

        .btn-primary:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.6);
        }

        .auth-toggle a {
            color: #e94560;
            cursor: pointer;
            text-decoration: none;
        }

        /* Books Grid */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 24px;
        }

        .book-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .book-cover {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #e94560, #0f3460);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            position: relative;
            overflow: hidden;
        }

        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cover-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .book-info {
            padding: 20px;
        }

        .book-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .book-author {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .book-price {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-tag {
            font-size: 16px;
            color: #e94560;
            font-weight: 600;
        }

        .btn-buy {
            background: #e94560;
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-buy:hover {
            background: #d63550;
        }

        .btn-buy.owned {
            background: #28a745;
            cursor: default;
        }

        /* Library */
        .library-empty {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.6);
        }

        .library-book {
            display: flex;
            gap: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .library-book-cover {
            width: 100px;
            height: 140px;
            background: linear-gradient(135deg, #e94560, #0f3460);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .library-book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .library-cover-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .library-book-info {
            flex: 1;
        }

        .library-book-title {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .library-book-author {
            color: rgba(255,255,255,0.6);
            margin-bottom: 16px;
        }

        .library-book-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-listen {
            background: #28a745;
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-listen:hover {
            background: #218838;
        }

        .btn-chat {
            background: #0f3460;
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-chat:hover {
            background: #1a4a7a;
        }

        /* Chat */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 200px);
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .chat-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .chat-book-title {
            font-size: 18px;
        }

        .chat-context-info {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
        }

        /* Persona Selector */
        .persona-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .persona-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid transparent;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .persona-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .persona-btn.active {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.2);
        }

        .persona-btn .persona-type {
            font-size: 11px;
            opacity: 0.7;
        }

        .persona-avatar {
            font-size: 16px;
        }

        .btn-back {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 16px;
            max-width: 80%;
        }

        .message.user {
            margin-left: auto;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: #e94560;
        }

        .message.assistant .message-content {
            background: rgba(255,255,255,0.1);
        }

        .message-label {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 4px;
        }

        .chat-input-container {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
        }

        .chat-input:focus {
            outline: none;
            border-color: #e94560;
        }

        .btn-send {
            background: #e94560;
            border: none;
            color: #fff;
            padding: 14px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-send:disabled {
            background: #666;
            cursor: not-allowed;
        }

        /* Audio Player Page */
        .player-container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
        }

        .player-book-info {
            flex: 1;
        }

        .player-book-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .player-book-author {
            color: rgba(255,255,255,0.6);
            font-size: 16px;
        }

        .player-cover {
            width: 120px;
            height: 160px;
            background: linear-gradient(135deg, #e94560, #0f3460);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            flex-shrink: 0;
            margin-left: 20px;
            position: relative;
            overflow: hidden;
        }

        .player-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }

        .player-cover-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        /* Chapter Select */
        .chapter-select-container {
            margin-bottom: 30px;
        }

        .chapter-select-label {
            display: block;
            margin-bottom: 10px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        .chapter-select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        .chapter-select:focus {
            outline: none;
            border-color: #e94560;
        }

        .chapter-select option {
            background: #1a1a2e;
            color: #fff;
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b8a);
            border-radius: 4px;
            transition: width 0.1s;
        }

        .progress-bar:hover .progress-fill {
            background: linear-gradient(90deg, #ff6b8a, #e94560);
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 14px;
            color: rgba(255,255,255,0.6);
        }

        /* Main Controls */
        .main-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-btn {
            background: transparent;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 24px;
            padding: 10px;
            opacity: 0.8;
            transition: opacity 0.2s, transform 0.2s;
        }

        .control-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .play-btn {
            width: 70px;
            height: 70px;
            background: #e94560;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .play-btn:hover {
            background: #d63550;
        }

        /* Secondary Controls */
        .secondary-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .volume-control, .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-label {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
        }

        .volume-slider, .speed-slider {
            width: 80px;
            height: 6px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb, .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #e94560;
            border-radius: 50%;
            cursor: pointer;
        }

        .speed-display {
            width: 40px;
            text-align: center;
            font-size: 14px;
            color: rgba(255,255,255,0.8);
        }

        /* Mini Player */
        .mini-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 15px 20px;
            display: none;
            z-index: 1000;
        }

        .mini-player.active {
            display: block;
        }

        .mini-player-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .mini-player-info {
            flex: 1;
            min-width: 0;
        }

        .mini-player-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-player-chapter {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
        }

        .mini-player-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .mini-control-btn {
            background: transparent;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            padding: 8px;
            opacity: 0.8;
        }

        .mini-control-btn:hover {
            opacity: 1;
        }

        .mini-play-btn {
            width: 44px;
            height: 44px;
            background: #e94560;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .mini-progress {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .mini-progress-fill {
            height: 100%;
            background: #e94560;
        }

        .mini-time {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            min-width: 80px;
            text-align: center;
        }

        .mini-expand-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        /* Loading */
        .loading {
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Typing Indicator for Streaming */
        .typing-indicator {
            display: inline-block;
            color: rgba(255,255,255,0.6);
            font-style: italic;
        }

        .typing-indicator::after {
            content: '';
            animation: typingDots 1.5s infinite;
        }

        @keyframes typingDots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        /* Streaming message content */
        .message-content.streaming {
            border-right: 2px solid #e94560;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 50% { border-color: #e94560; }
            51%, 100% { border-color: transparent; }
        }

        /* Alert */
        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .alert.success {
            background: #28a745;
        }

        .alert.error {
            background: #dc3545;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Section titles */
        .section-title {
            font-size: 24px;
            margin-bottom: 24px;
        }

        /* Browse Header with Search */
        .browse-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .browse-header .section-title {
            margin-bottom: 0;
        }

        .search-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-input-wrapper {
            position: relative;
            width: 280px;
        }

        .search-input {
            width: 100%;
            padding: 10px 36px 10px 14px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
        }

        .search-input:focus {
            outline: none;
            border-color: #e94560;
        }

        .search-input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .search-clear-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            font-size: 14px;
            padding: 4px 6px;
            display: none;
            line-height: 1;
        }

        .search-clear-btn:hover {
            color: #fff;
        }

        .search-clear-btn.visible {
            display: block;
        }

        .search-status {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 16px;
        }

        @media (max-width: 600px) {
            .browse-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .search-input-wrapper {
                width: 100%;
            }
        }

        /* Reading Progress Badge */
        .progress-badge {
            display: inline-block;
            background: rgba(233, 69, 96, 0.2);
            color: #e94560;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            margin-top: 8px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .mini-progress {
                display: none;
            }

            .mini-player-controls {
                gap: 10px;
            }

            .library-book {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .library-book-buttons {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Auth Page -->
        <div id="auth-page" class="page active">
            <div class="auth-container">
                <h1 class="auth-title">BetterBooks</h1>

                <!-- Login Form -->
                <form id="login-form">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn-primary">Sign In</button>
                </form>

                <!-- Signup Form (hidden by default) -->
                <form id="signup-form" style="display: none;">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="signup-name" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="signup-email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="signup-password" required minlength="6">
                    </div>
                    <button type="submit" class="btn-primary">Create Account</button>
                </form>

                <p class="auth-toggle" id="auth-toggle">
                    Don't have an account? <a onclick="toggleAuthForm()">Sign up</a>
                </p>
            </div>
        </div>

        <!-- Main App -->
        <div id="main-app" class="page">
            <header>
                <div class="logo">BetterBooks</div>
                <div class="user-info">
                    <span class="credits-badge" id="credits-display">0 Credits</span>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </header>

            <div class="nav-tabs">
                <button class="nav-tab active" onclick="showPage('browse', event)">Browse</button>
                <button class="nav-tab" onclick="showPage('library', event)">My Library</button>
            </div>

            <!-- Browse Page -->
            <div id="browse-page" class="page active">
                <div class="browse-header">
                    <h2 class="section-title">Discover Audiobooks</h2>
                    <div class="search-container">
                        <div class="search-input-wrapper">
                            <input type="text" class="search-input" id="search-input" placeholder="Search books...">
                            <button class="search-clear-btn" id="search-clear-btn" onclick="clearSearch()">X</button>
                        </div>
                    </div>
                </div>
                <div id="search-status" class="search-status" style="display: none;"></div>
                <div id="books-grid" class="books-grid">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>

            <!-- Library Page -->
            <div id="library-page" class="page">
                <h2 class="section-title">My Library</h2>
                <div id="library-list">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>

            <!-- Player Page -->
            <div id="player-page" class="page">
                <div class="player-container">
                    <div class="player-header">
                        <div class="player-book-info">
                            <div class="player-book-title" id="player-book-title">Book Title</div>
                            <div class="player-book-author" id="player-book-author">Author</div>
                        </div>
                        <div class="player-cover" id="player-cover">📚</div>
                    </div>

                    <div class="chapter-select-container">
                        <label class="chapter-select-label">Chapter</label>
                        <select class="chapter-select" id="chapter-select">
                            <option>Loading chapters...</option>
                        </select>
                    </div>

                    <div class="progress-container">
                        <div class="progress-bar" id="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        <div class="time-display">
                            <span id="current-time">0:00</span>
                            <span id="total-time">0:00</span>
                        </div>
                    </div>

                    <div class="main-controls">
                        <button class="control-btn" onclick="skipBackward()" title="Back 10s">⏪</button>
                        <button class="control-btn" onclick="prevChapter()" title="Previous Chapter">⏮</button>
                        <button class="control-btn play-btn" id="play-btn" onclick="togglePlay()">▶</button>
                        <button class="control-btn" onclick="nextChapter()" title="Next Chapter">⏭</button>
                        <button class="control-btn" onclick="skipForward()" title="Forward 30s">⏩</button>
                    </div>

                    <div class="secondary-controls">
                        <div class="volume-control">
                            <span class="control-label">🔊</span>
                            <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.1" value="1">
                        </div>
                        <div class="speed-control">
                            <span class="control-label">Speed</span>
                            <input type="range" class="speed-slider" id="speed-slider" min="0.5" max="2" step="0.25" value="1">
                            <span class="speed-display" id="speed-display">1x</span>
                        </div>
                    </div>

                    <div style="margin-top: 30px; text-align: center;">
                        <button class="btn-chat" onclick="openChatFromPlayer()">💬 Chat with AI about this book</button>
                        <button class="btn-back" onclick="closePlayer()" style="margin-left: 10px;">← Back to Library</button>
                    </div>
                </div>
            </div>

            <!-- Chat Page -->
            <div id="chat-page" class="page">
                <div class="chat-container">
                    <div class="chat-header">
                        <div class="chat-header-top">
                            <div>
                                <div class="chat-book-title" id="chat-book-title">Book Title</div>
                                <div class="chat-context-info" id="chat-context-info">Chapter 1 • 0:00</div>
                            </div>
                            <button class="btn-back" onclick="closeChat()">Back to Library</button>
                        </div>
                        <div class="persona-selector" id="persona-selector">
                            <!-- Personas loaded dynamically -->
                        </div>
                    </div>
                    <div class="chat-messages" id="chat-messages"></div>
                    <div class="chat-input-container">
                        <input type="text" class="chat-input" id="chat-input" placeholder="Ask about the book...">
                        <button class="btn-send" id="btn-send" onclick="sendMessage()">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Mini Player (persistent at bottom) -->
    <div class="mini-player" id="mini-player">
        <div class="mini-player-content">
            <div class="mini-player-info">
                <div class="mini-player-title" id="mini-player-title">Book Title</div>
                <div class="mini-player-chapter" id="mini-player-chapter">Chapter 1</div>
            </div>
            <div class="mini-player-controls">
                <button class="mini-control-btn" onclick="skipBackward()">⏪</button>
                <button class="mini-control-btn mini-play-btn" id="mini-play-btn" onclick="togglePlay()">▶</button>
                <button class="mini-control-btn" onclick="skipForward()">⏩</button>
            </div>
            <div class="mini-progress">
                <div class="mini-progress-fill" id="mini-progress-fill"></div>
            </div>
            <div class="mini-time" id="mini-time">0:00 / 0:00</div>
            <button class="mini-expand-btn" onclick="expandPlayer()">Expand</button>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audio-player" preload="auto"></audio>

    <script>
        // Configuration - supports runtime injection via window.APP_CONFIG
        // In production, config.js is served by the backend/CDN with actual values
        const API_URL = window.APP_CONFIG?.API_URL || 'http://localhost:8000';
        const LLM_URL = window.APP_CONFIG?.LLM_URL || 'http://localhost:8002';

        // State
        let token = localStorage.getItem('token');
        let currentUser = null;
        let books = [];
        let library = [];
        let currentChatBook = null;
        let chatHistory = [];
        let availablePersonas = [];
        let selectedPersona = null;
        let chatContext = { chapter: 1, timestamp: 0 };

        // Audio Player State
        let audioPlayer = null;
        let currentPlayingBook = null;
        let currentChapter = 0;
        let chapters = [];
        let isPlaying = false;
        let savedProgress = {};

        // Progress Sync State
        let lastServerSyncTime = 0;
        const SERVER_SYNC_INTERVAL_MS = 30000; // Sync to server every 30 seconds

        // Search State
        let searchQuery = '';
        let searchResults = null;
        let searchDebounceTimer = null;
        const SEARCH_DEBOUNCE_MS = 300;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            audioPlayer = document.getElementById('audio-player');
            setupAudioEventListeners();
            loadSavedProgress();

            if (token) {
                showMainApp();
            }

            // Enter key for chat
            document.getElementById('chat-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            // Search input event listener with debouncing
            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                updateSearchClearButton(query);

                // Debounce the search
                if (searchDebounceTimer) {
                    clearTimeout(searchDebounceTimer);
                }
                searchDebounceTimer = setTimeout(() => {
                    handleSearch(query);
                }, SEARCH_DEBOUNCE_MS);
            });

            // Enter key for search (immediate search)
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    if (searchDebounceTimer) {
                        clearTimeout(searchDebounceTimer);
                    }
                    handleSearch(e.target.value.trim());
                }
            });
        });

        // Save progress when leaving the page (localStorage save is immediate)
        // Server sync will happen on next page load via fetchServerProgress
        window.addEventListener('beforeunload', () => {
            if (currentPlayingBook) {
                saveCurrentProgress();
            }
        });

        // Also handle visibility change (e.g., switching tabs or minimizing)
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden' && currentPlayingBook) {
                saveAndSyncProgress();
            }
        });

        // Audio Event Listeners
        function setupAudioEventListeners() {
            audioPlayer.addEventListener('timeupdate', updateProgress);
            audioPlayer.addEventListener('loadedmetadata', updateDuration);
            audioPlayer.addEventListener('ended', onChapterEnd);
            audioPlayer.addEventListener('play', () => {
                isPlaying = true;
                updatePlayButtons();
            });
            audioPlayer.addEventListener('pause', () => {
                isPlaying = false;
                updatePlayButtons();
                saveAndSyncProgress();
            });
            audioPlayer.addEventListener('error', (e) => {
                console.error('Audio error:', e);
                showAlert('Failed to load audio file', 'error');
            });

            // Progress bar click
            document.getElementById('progress-bar').addEventListener('click', seekToPosition);

            // Volume slider
            document.getElementById('volume-slider').addEventListener('input', (e) => {
                audioPlayer.volume = e.target.value;
            });

            // Speed slider
            document.getElementById('speed-slider').addEventListener('input', (e) => {
                audioPlayer.playbackRate = e.target.value;
                document.getElementById('speed-display').textContent = e.target.value + 'x';
            });

            // Chapter select
            document.getElementById('chapter-select').addEventListener('change', (e) => {
                const chapterIndex = parseInt(e.target.value);
                playChapter(chapterIndex);
            });
        }

        // Alert helper
        function showAlert(message, type = 'success') {
            const alert = document.createElement('div');
            alert.className = `alert ${type}`;
            alert.textContent = message;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 3000);
        }

        // Auth functions
        function toggleAuthForm() {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const toggle = document.getElementById('auth-toggle');

            if (loginForm.style.display !== 'none') {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                toggle.innerHTML = 'Already have an account? <a onclick="toggleAuthForm()">Sign in</a>';
            } else {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                toggle.innerHTML = "Don't have an account? <a onclick=\"toggleAuthForm()\">Sign up</a>";
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(`${API_URL}/auth/signin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    token = data.access_token;
                    localStorage.setItem('token', token);
                    currentUser = data.user;
                    showMainApp();
                    showAlert('Welcome back!');
                } else {
                    showAlert(data.detail || 'Login failed', 'error');
                }
            } catch (err) {
                showAlert('Connection error', 'error');
            }
        });

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            try {
                const res = await fetch(`${API_URL}/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    token = data.access_token;
                    localStorage.setItem('token', token);
                    currentUser = data.user;
                    showMainApp();
                    showAlert('Account created! You have 5 credits to start.');
                } else {
                    showAlert(data.detail || 'Signup failed', 'error');
                }
            } catch (err) {
                showAlert('Connection error', 'error');
            }
        });

        function logout() {
            token = null;
            localStorage.removeItem('token');
            currentUser = null;
            stopPlayback();
            // Clear progress sync interval to prevent memory leak
            if (progressSyncIntervalId) {
                clearInterval(progressSyncIntervalId);
                progressSyncIntervalId = null;
            }
            document.getElementById('auth-page').classList.add('active');
            document.getElementById('main-app').classList.remove('active');
        }

        // Main app
        async function showMainApp() {
            document.getElementById('auth-page').classList.remove('active');
            document.getElementById('main-app').classList.add('active');

            await loadCredits();
            await loadBooks();
            await loadLibrary();
            // Fetch server progress and merge with localStorage
            await fetchServerProgress();
            // Re-render both views to show correct owned status and progress
            renderBooks();
            renderLibrary();
        }

        async function loadCredits() {
            try {
                const res = await fetch(`${API_URL}/bookstore/user/credits`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                document.getElementById('credits-display').textContent = `${data.available_credits} Credits`;
            } catch (err) {
                console.error('Failed to load credits:', err);
            }
        }

        async function loadBooks() {
            try {
                const res = await fetch(`${API_URL}/bookstore/browse`);
                const data = await res.json();
                books = data.books || [];
                renderBooks();
            } catch (err) {
                console.error('Failed to load books:', err);
                document.getElementById('books-grid').innerHTML = '<p>Failed to load books</p>';
            }
        }

        async function loadLibrary() {
            try {
                const res = await fetch(`${API_URL}/bookstore/user/library`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                library = data.books || [];
                renderLibrary();
            } catch (err) {
                console.error('Failed to load library:', err);
            }
        }

        // ==========================================
        // SEARCH FUNCTIONS
        // ==========================================

        async function handleSearch(query) {
            searchQuery = query;

            if (!query) {
                // Empty query - show all books
                searchResults = null;
                updateSearchStatus(null);
                renderBooks();
                return;
            }

            // Show loading state
            updateSearchStatus('Searching...');

            try {
                const res = await fetch(`${API_URL}/bookstore/search?q=${encodeURIComponent(query)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    searchResults = data.books || [];
                    updateSearchStatus(`Found ${searchResults.length} book${searchResults.length !== 1 ? 's' : ''} for "${query}"`);
                    renderBooks();
                } else {
                    // If search endpoint fails, fall back to client-side filtering
                    console.warn('Search endpoint returned error, using client-side filtering');
                    searchResults = filterBooksLocally(query);
                    updateSearchStatus(`Found ${searchResults.length} book${searchResults.length !== 1 ? 's' : ''} for "${query}"`);
                    renderBooks();
                }
            } catch (err) {
                console.error('Search error:', err);
                // Fall back to client-side filtering
                searchResults = filterBooksLocally(query);
                updateSearchStatus(`Found ${searchResults.length} book${searchResults.length !== 1 ? 's' : ''} for "${query}"`);
                renderBooks();
            }
        }

        function filterBooksLocally(query) {
            const lowerQuery = query.toLowerCase();
            return books.filter(book =>
                book.title.toLowerCase().includes(lowerQuery) ||
                book.author.toLowerCase().includes(lowerQuery) ||
                (book.description && book.description.toLowerCase().includes(lowerQuery))
            );
        }

        function updateSearchStatus(message) {
            const statusEl = document.getElementById('search-status');
            if (message) {
                statusEl.textContent = message;
                statusEl.style.display = 'block';
            } else {
                statusEl.style.display = 'none';
            }
        }

        function updateSearchClearButton(query) {
            const clearBtn = document.getElementById('search-clear-btn');
            if (query) {
                clearBtn.classList.add('visible');
            } else {
                clearBtn.classList.remove('visible');
            }
        }

        function clearSearch() {
            const searchInput = document.getElementById('search-input');
            searchInput.value = '';
            searchQuery = '';
            searchResults = null;
            updateSearchClearButton('');
            updateSearchStatus(null);
            renderBooks();
            searchInput.focus();
        }

        function renderBooks() {
            const grid = document.getElementById('books-grid');

            // Use search results if available, otherwise use all books
            const booksToRender = searchResults !== null ? searchResults : books;

            if (booksToRender.length === 0) {
                if (searchResults !== null) {
                    grid.innerHTML = '<p>No books found matching your search.</p>';
                } else {
                    grid.innerHTML = '<p>No books available</p>';
                }
                return;
            }

            grid.innerHTML = booksToRender.map(book => {
                const owned = library.some(lb => lb.id === book.id);
                const coverUrl = book.cover_image_url ? `${API_URL}${book.cover_image_url}` : `${API_URL}/books/cover/${encodeURIComponent(book.title)}/cover.jpg`;
                const fallbackEmoji = getBookEmoji(book.title);
                return `
                    <div class="book-card">
                        <div class="book-cover">
                            <img src="${coverUrl}"
                                 alt="${escapeHtml(book.title)}"
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="cover-fallback" style="display:none;">${fallbackEmoji}</div>
                        </div>
                        <div class="book-info">
                            <div class="book-title">${book.title}</div>
                            <div class="book-author">${book.author}</div>
                            <div class="book-price">
                                <span class="price-tag">${book.credit_price} Credit${book.credit_price > 1 ? 's' : ''}</span>
                                ${owned
                                    ? '<button class="btn-buy owned">Owned</button>'
                                    : `<button class="btn-buy" onclick="purchaseBook('${book.id}')">Buy</button>`
                                }
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderLibrary() {
            const list = document.getElementById('library-list');

            if (library.length === 0) {
                list.innerHTML = `
                    <div class="library-empty">
                        <p>Your library is empty.</p>
                        <p>Browse and purchase books to get started!</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = library.map(book => {
                // Use progress from API (completion_percentage) or local savedProgress
                const localProgress = savedProgress[book.id];
                let progressHtml = '';
                if (book.progress > 0) {
                    // Use server-side progress percentage
                    const percent = Math.round(book.progress);
                    const chapterNum = localProgress ? localProgress.chapterIndex + 1 : 1;
                    progressHtml = `<div class="progress-badge">Chapter ${chapterNum} • ${percent}% complete</div>`;
                } else if (localProgress) {
                    // Fall back to local progress if no server progress
                    const percent = Math.round((localProgress.chapterIndex / (book.total_chapters || 9)) * 100);
                    progressHtml = `<div class="progress-badge">Chapter ${localProgress.chapterIndex + 1} • ${percent}% complete</div>`;
                }

                const coverUrl = book.cover_image_url ? `${API_URL}${book.cover_image_url}` : `${API_URL}/books/cover/${encodeURIComponent(book.title)}/cover.jpg`;
                const fallbackEmoji = getBookEmoji(book.title);

                return `
                    <div class="library-book">
                        <div class="library-book-cover">
                            <img src="${coverUrl}"
                                 alt="${escapeHtml(book.title)}"
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="library-cover-fallback" style="display:none;">${fallbackEmoji}</div>
                        </div>
                        <div class="library-book-info">
                            <div class="library-book-title">${book.title}</div>
                            <div class="library-book-author">${book.author}</div>
                            ${progressHtml}
                            <div class="library-book-buttons">
                                <button class="btn-listen" onclick="openPlayer('${book.id}', '${book.title.replace(/'/g, "\\'")}', '${book.author.replace(/'/g, "\\'")}')">
                                    🎧 Listen
                                </button>
                                <button class="btn-chat" onclick="openChat('${book.id}', '${book.title.replace(/'/g, "\\'")}')">
                                    💬 Chat with AI
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getBookEmoji(title) {
            const emojis = {
                'gatsby': '🥂',
                'pride': '💝',
                'jane': '📖',
                'moby': '🐋',
                'alice': '🐰',
                'war': '⚔️',
                'odyssey': '🏛️',
                'default': '📚'
            };
            const lower = title.toLowerCase();
            for (const [key, emoji] of Object.entries(emojis)) {
                if (lower.includes(key)) return emoji;
            }
            return emojis.default;
        }

        async function purchaseBook(bookId) {
            // Find and disable the purchase button to prevent double-clicks
            const purchaseBtn = document.querySelector(`button[onclick="purchaseBook('${bookId}')"]`);
            if (purchaseBtn) {
                purchaseBtn.disabled = true;
                purchaseBtn.textContent = 'Processing...';
            }

            try {
                const res = await fetch(`${API_URL}/bookstore/purchase`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ book_id: bookId })
                });

                const data = await res.json();

                if (res.ok) {
                    showAlert(data.message);
                    await loadCredits();
                    await loadLibrary();
                    renderBooks();
                } else {
                    showAlert(data.detail || 'Purchase failed', 'error');
                    // Re-enable button on error
                    if (purchaseBtn) {
                        purchaseBtn.disabled = false;
                        purchaseBtn.textContent = 'Buy';
                    }
                }
            } catch (err) {
                showAlert('Purchase failed', 'error');
                // Re-enable button on error
                if (purchaseBtn) {
                    purchaseBtn.disabled = false;
                    purchaseBtn.textContent = 'Buy';
                }
            }
        }

        // Navigation
        function showPage(page, event) {
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));

            // Handle event from button click or direct call
            if (event && event.target) {
                event.target.classList.add('active');
            } else {
                // Find the correct tab button and mark it active
                const tabs = document.querySelectorAll('.nav-tab');
                const tabIndex = page === 'browse' ? 0 : 1;
                if (tabs[tabIndex]) tabs[tabIndex].classList.add('active');
            }

            document.getElementById('browse-page').classList.remove('active');
            document.getElementById('library-page').classList.remove('active');
            document.getElementById('chat-page').classList.remove('active');
            document.getElementById('player-page').classList.remove('active');

            document.getElementById(`${page}-page`).classList.add('active');
        }

        // ==========================================
        // AUDIO PLAYER FUNCTIONS
        // ==========================================

        async function openPlayer(bookId, bookTitle, bookAuthor) {
            currentPlayingBook = { id: bookId, title: bookTitle, author: bookAuthor };

            // Find the book data to get cover_image_url
            const bookData = library.find(b => b.id === bookId) || books.find(b => b.id === bookId);
            const coverUrl = bookData?.cover_image_url
                ? `${API_URL}${bookData.cover_image_url}`
                : `${API_URL}/books/cover/${encodeURIComponent(bookTitle)}/cover.jpg`;
            const fallbackEmoji = getBookEmoji(bookTitle);

            // Update UI
            document.getElementById('player-book-title').textContent = bookTitle;
            document.getElementById('player-book-author').textContent = bookAuthor;
            document.getElementById('mini-player-title').textContent = bookTitle;

            // Update player cover with image and fallback
            const playerCover = document.getElementById('player-cover');
            playerCover.innerHTML = `
                <img src="${coverUrl}"
                     alt="${escapeHtml(bookTitle)}"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="player-cover-fallback" style="display:none;">${fallbackEmoji}</div>
            `;

            // Generate chapters (we know The Great Gatsby has 9 chapters)
            const totalChapters = getTotalChapters(bookTitle);
            chapters = [];
            for (let i = 1; i <= totalChapters; i++) {
                chapters.push({
                    number: i,
                    title: `Chapter ${i}`,
                    audioUrl: `${API_URL}/audio/${encodeURIComponent(bookTitle)}/Chapter ${i}.mp3`
                });
            }

            // Populate chapter select
            const chapterSelect = document.getElementById('chapter-select');
            chapterSelect.innerHTML = chapters.map((ch, idx) =>
                `<option value="${idx}">${ch.title}</option>`
            ).join('');

            // Restore progress if available
            const progress = savedProgress[bookId];
            if (progress) {
                currentChapter = progress.chapterIndex || 0;
                chapterSelect.value = currentChapter;
            } else {
                currentChapter = 0;
            }

            // Show player page
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById('browse-page').classList.remove('active');
            document.getElementById('library-page').classList.remove('active');
            document.getElementById('chat-page').classList.remove('active');
            document.getElementById('player-page').classList.add('active');

            // Load and play chapter
            await playChapter(currentChapter, progress?.position || 0);

            // Show mini player
            document.getElementById('mini-player').classList.add('active');
        }

        function getTotalChapters(bookTitle) {
            const chapterCounts = {
                'The Great Gatsby': 9,
                'Pride and Prejudice': 61,
                'Moby Dick': 47,
                "Alice's Adventures in Wonderland": 12,
                'War and Peace': 50,
                'Odyssey': 24
            };
            return chapterCounts[bookTitle] || 10;
        }

        async function playChapter(chapterIndex, startPosition = 0) {
            if (chapterIndex < 0 || chapterIndex >= chapters.length) return;

            currentChapter = chapterIndex;
            const chapter = chapters[chapterIndex];

            // Update chapter select
            document.getElementById('chapter-select').value = chapterIndex;
            document.getElementById('mini-player-chapter').textContent = chapter.title;

            // Load audio
            audioPlayer.src = chapter.audioUrl;

            audioPlayer.addEventListener('canplay', function onCanPlay() {
                if (startPosition > 0) {
                    audioPlayer.currentTime = startPosition;
                }
                audioPlayer.play().catch(() => {});
                audioPlayer.removeEventListener('canplay', onCanPlay);
            }, { once: true });

            audioPlayer.load();
        }

        function togglePlay() {
            if (audioPlayer.paused) {
                audioPlayer.play().catch(e => {
                    console.error('Play failed:', e);
                    showAlert('Click to start playback', 'error');
                });
            } else {
                audioPlayer.pause();
            }
        }

        function updatePlayButtons() {
            const icon = isPlaying ? '⏸' : '▶';
            document.getElementById('play-btn').textContent = icon;
            document.getElementById('mini-play-btn').textContent = icon;
        }

        function updateProgress() {
            const current = audioPlayer.currentTime;
            const duration = audioPlayer.duration || 0;
            const percent = duration > 0 ? (current / duration) * 100 : 0;

            document.getElementById('progress-fill').style.width = `${percent}%`;
            document.getElementById('mini-progress-fill').style.width = `${percent}%`;
            document.getElementById('current-time').textContent = formatTime(current);
            document.getElementById('mini-time').textContent = `${formatTime(current)} / ${formatTime(duration)}`;
        }

        function updateDuration() {
            const duration = audioPlayer.duration || 0;
            document.getElementById('total-time').textContent = formatTime(duration);
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function seekToPosition(e) {
            const bar = document.getElementById('progress-bar');
            const rect = bar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            const duration = audioPlayer.duration || 0;
            audioPlayer.currentTime = percent * duration;
        }

        function skipForward() {
            audioPlayer.currentTime = Math.min(audioPlayer.currentTime + 30, audioPlayer.duration || 0);
        }

        function skipBackward() {
            audioPlayer.currentTime = Math.max(audioPlayer.currentTime - 10, 0);
        }

        function nextChapter() {
            if (currentChapter < chapters.length - 1) {
                playChapter(currentChapter + 1);
            }
        }

        function prevChapter() {
            if (audioPlayer.currentTime > 3) {
                // If more than 3 seconds in, restart current chapter
                audioPlayer.currentTime = 0;
            } else if (currentChapter > 0) {
                playChapter(currentChapter - 1);
            }
        }

        function onChapterEnd() {
            saveAndSyncProgress();
            if (currentChapter < chapters.length - 1) {
                // Auto-advance to next chapter
                nextChapter();
            } else {
                // Book finished
                showAlert('Book completed!');
                isPlaying = false;
                updatePlayButtons();
            }
        }

        function closePlayer() {
            saveAndSyncProgress();
            document.getElementById('player-page').classList.remove('active');
            document.getElementById('library-page').classList.add('active');
            document.querySelectorAll('.nav-tab')[1].classList.add('active');
        }

        function expandPlayer() {
            if (!currentPlayingBook) return;

            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById('browse-page').classList.remove('active');
            document.getElementById('library-page').classList.remove('active');
            document.getElementById('chat-page').classList.remove('active');
            document.getElementById('player-page').classList.add('active');
        }

        function stopPlayback() {
            audioPlayer.pause();
            audioPlayer.src = '';
            currentPlayingBook = null;
            document.getElementById('mini-player').classList.remove('active');
        }

        // Progress Persistence
        function loadSavedProgress() {
            try {
                const saved = localStorage.getItem('betterbooks_progress');
                if (saved) {
                    savedProgress = JSON.parse(saved);
                }
            } catch (e) {
                savedProgress = {};
            }
        }

        // Fetch progress from server and merge with localStorage
        async function fetchServerProgress() {
            if (!token) return;

            try {
                const res = await fetch(`${API_URL}/bookstore/user/progress`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    const serverProgress = data.progress || {};

                    // Merge server progress with local - use whichever is more recent
                    for (const bookId in serverProgress) {
                        const server = serverProgress[bookId];
                        const local = savedProgress[bookId];

                        // Server returns: { chapter, position_seconds, updated_at }
                        // Local stores: { chapterIndex, position, timestamp }
                        const serverTimestamp = server.updated_at ? new Date(server.updated_at).getTime() : 0;

                        if (!local || serverTimestamp > (local.timestamp || 0)) {
                            // Server progress is newer or local doesn't exist
                            savedProgress[bookId] = {
                                chapterIndex: (server.chapter || 1) - 1, // Convert 1-indexed to 0-indexed
                                position: server.position_seconds || 0,
                                timestamp: serverTimestamp
                            };
                        }
                    }

                    // Save merged progress to localStorage
                    try {
                        localStorage.setItem('betterbooks_progress', JSON.stringify(savedProgress));
                    } catch (e) {
                        // Silently fail - localStorage may be unavailable
                    }
                }
            } catch (err) {
                console.error('Failed to fetch server progress:', err);
            }
        }

        // Sync progress to server
        async function syncProgressToServer(bookId, chapterIndex, positionSeconds) {
            if (!token || !bookId) return;

            try {
                const res = await fetch(`${API_URL}/bookstore/user/progress`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        book_id: bookId,
                        position: Math.floor(positionSeconds)
                    })
                });

                if (res.ok) {
                    lastServerSyncTime = Date.now();
                }
            } catch (err) {
                // Silently fail - server sync is non-critical
            }
        }

        // Debounced server sync - only syncs if enough time has passed
        function debouncedServerSync() {
            if (!currentPlayingBook) return;

            const now = Date.now();
            if (now - lastServerSyncTime >= SERVER_SYNC_INTERVAL_MS) {
                syncProgressToServer(
                    currentPlayingBook.id,
                    currentChapter,
                    audioPlayer.currentTime
                );
            }
        }

        function saveCurrentProgress() {
            if (!currentPlayingBook) return;

            savedProgress[currentPlayingBook.id] = {
                chapterIndex: currentChapter,
                position: audioPlayer.currentTime,
                timestamp: Date.now()
            };

            try {
                localStorage.setItem('betterbooks_progress', JSON.stringify(savedProgress));
            } catch (e) {
                console.error('Failed to save progress:', e);
            }
        }

        // Save progress with immediate server sync (for pause/close events)
        function saveAndSyncProgress() {
            if (!currentPlayingBook) return;

            saveCurrentProgress();
            // Force sync to server on pause/close
            syncProgressToServer(
                currentPlayingBook.id,
                currentChapter,
                audioPlayer.currentTime
            );
        }

        // Save progress every 10 seconds during playback (localStorage)
        // Check for server sync every 10 seconds (but only syncs every 30 seconds)
        let progressSyncIntervalId = setInterval(() => {
            if (isPlaying && currentPlayingBook) {
                saveCurrentProgress();
                debouncedServerSync();
            }
        }, 10000);

        // ==========================================
        // CHAT FUNCTIONS (Context-Aware with Personas)
        // ==========================================

        async function loadPersonas(bookTitle) {
            try {
                const res = await fetch(`${API_URL}/ai/personas/${encodeURIComponent(bookTitle)}`);
                if (res.ok) {
                    const data = await res.json();
                    availablePersonas = data.personas || [];
                    renderPersonaSelector();
                } else {
                    // Fallback personas if endpoint not available
                    availablePersonas = [
                        { id: 'english-teacher', name: 'English Teacher', type: 'guide', is_book_specific: false }
                    ];
                    renderPersonaSelector();
                }
            } catch (err) {
                console.error('Failed to load personas:', err);
                availablePersonas = [
                    { id: 'english-teacher', name: 'English Teacher', type: 'guide', is_book_specific: false }
                ];
                renderPersonaSelector();
            }
        }

        function renderPersonaSelector() {
            const container = document.getElementById('persona-selector');
            if (availablePersonas.length === 0) {
                container.innerHTML = '<span style="color: rgba(255,255,255,0.5);">No personas available</span>';
                return;
            }

            container.innerHTML = availablePersonas.map(persona => {
                const avatar = persona.type === 'character' ? '🎭' : '📚';
                const isActive = selectedPersona?.id === persona.id;
                const escapedId = escapeHtml(persona.id);
                const escapedName = escapeHtml(persona.name);
                return `
                    <button class="persona-btn ${isActive ? 'active' : ''}" onclick="selectPersona('${escapedId}')">
                        <span class="persona-avatar">${avatar}</span>
                        <span>${escapedName}</span>
                    </button>
                `;
            }).join('');

            // Auto-select first persona if none selected
            if (!selectedPersona && availablePersonas.length > 0) {
                selectPersona(availablePersonas[0].id);
            }
        }

        function selectPersona(personaId) {
            selectedPersona = availablePersonas.find(p => p.id === personaId);
            renderPersonaSelector();

            // Update welcome message
            if (selectedPersona && currentChatBook) {
                const messagesDiv = document.getElementById('chat-messages');
                const welcomeMsg = selectedPersona.type === 'character'
                    ? `Hello! I'm ${selectedPersona.name}. What would you like to discuss about the story so far?`
                    : `Hello! I'm your ${selectedPersona.name}. I'm here to help you understand "${currentChatBook.title}". Ask me anything!`;

                messagesDiv.innerHTML = `
                    <div class="message assistant">
                        <div class="message-label">${selectedPersona.name}</div>
                        <div class="message-content">${welcomeMsg}</div>
                    </div>
                `;
                chatHistory = [];
            }
        }

        function updateChatContext() {
            // Get context from audio player if playing the same book
            if (currentPlayingBook && currentChatBook && currentPlayingBook.title === currentChatBook.title) {
                chatContext = {
                    chapter: currentChapter + 1,  // Convert 0-indexed to 1-indexed
                    timestamp: audioPlayer.currentTime || 0
                };
            } else {
                // Default to beginning if not playing
                chatContext = { chapter: 1, timestamp: 0 };
            }

            // Update UI
            const contextInfo = document.getElementById('chat-context-info');
            const mins = Math.floor(chatContext.timestamp / 60);
            const secs = Math.floor(chatContext.timestamp % 60);
            contextInfo.textContent = `Chapter ${chatContext.chapter} • ${mins}:${secs.toString().padStart(2, '0')} (spoiler-free)`;
        }

        async function openChat(bookId, bookTitle) {
            currentChatBook = { id: bookId, title: bookTitle };
            chatHistory = [];
            selectedPersona = null;

            document.getElementById('chat-book-title').textContent = bookTitle;
            document.getElementById('chat-messages').innerHTML = `
                <div class="message assistant">
                    <div class="message-label">AI Assistant</div>
                    <div class="message-content">Loading personas...</div>
                </div>
            `;

            // Navigate to chat page
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById('browse-page').classList.remove('active');
            document.getElementById('library-page').classList.remove('active');
            document.getElementById('player-page').classList.remove('active');
            document.getElementById('chat-page').classList.add('active');

            // Load personas and update context
            await loadPersonas(bookTitle);
            updateChatContext();
        }

        function openChatFromPlayer() {
            if (currentPlayingBook) {
                saveAndSyncProgress();
                openChat(currentPlayingBook.id, currentPlayingBook.title);
            }
        }

        function closeChat() {
            currentChatBook = null;
            selectedPersona = null;
            document.getElementById('chat-page').classList.remove('active');
            document.getElementById('library-page').classList.add('active');
            document.querySelectorAll('.nav-tab')[1].classList.add('active');
        }

        // Streaming chat configuration
        let useStreaming = true; // Enable streaming by default for better UX

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();

            if (!message || !currentChatBook) return;

            input.value = '';
            const sendBtn = document.getElementById('btn-send');
            sendBtn.disabled = true;

            // Update context before sending
            updateChatContext();

            // Add user message to UI
            const messagesDiv = document.getElementById('chat-messages');
            messagesDiv.innerHTML += `
                <div class="message user">
                    <div class="message-label">You</div>
                    <div class="message-content">${escapeHtml(message)}</div>
                </div>
            `;

            // Build conversation history to send (excluding current message - backend will add it)
            const historyToSend = chatHistory.slice(-10);

            const personaName = selectedPersona?.name || 'AI Assistant';
            const messageId = Date.now();

            // Add assistant message container with typing indicator
            messagesDiv.innerHTML += `
                <div class="message assistant" id="response-${messageId}">
                    <div class="message-label">${personaName}</div>
                    <div class="message-content" id="content-${messageId}">
                        <span class="typing-indicator">Thinking...</span>
                    </div>
                </div>
            `;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                // Use the context-aware AI chat endpoint with optional streaming
                const res = await fetch(`${API_URL}/ai/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        book_id: currentChatBook.title,
                        chapter: chatContext.chapter,
                        timestamp_seconds: chatContext.timestamp,
                        persona_id: selectedPersona?.id || 'english-teacher',
                        message: message,
                        conversation_history: historyToSend,
                        stream: useStreaming
                    })
                });

                const contentEl = document.getElementById(`content-${messageId}`);

                if (res.ok) {
                    const contentType = res.headers.get('content-type') || '';

                    if (contentType.includes('text/event-stream') && useStreaming) {
                        // Handle streaming response (Server-Sent Events)
                        await handleStreamingResponse(res, contentEl, message, personaName);
                    } else {
                        // Handle non-streaming response (fallback)
                        const data = await res.json();
                        const responseText = data.message || 'Sorry, I could not generate a response.';
