<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>echoWright Audiobooks</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Playfair+Display:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --teal: #4FBDAB;
            --teal-light: #E8F6F3;
            --teal-dark: #3A9B8C;
            --orange: #F5A623;
            --orange-light: #FFF4E0;
            --red-orange: #E04E39;
            --yellow: #FFDE59;
            --dark: #1E1E1E;
            --dark-soft: #3A3A3A;
            --gray: #888;
            --gray-light: #C8C8C8;
            --bg: #FAFAF8;
            --white: #FFFFFF;
            --card-shadow: 0 2px 16px rgba(0,0,0,0.06);
            --card-shadow-hover: 0 8px 32px rgba(0,0,0,0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--dark);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ── Screen Management ── */
        .screen {
            display: none;
            min-height: 100vh;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .screen.active {
            display: flex;
            flex-direction: column;
            opacity: 1;
        }

        /* ── Shared Layout ── */
        .screen-content {
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            padding: 0 24px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: var(--teal-dark);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 0;
            font-family: inherit;
            transition: color var(--transition);
        }
        .back-btn:hover { color: var(--teal); }
        .back-btn svg { width: 18px; height: 18px; }

        /* ══════════════════════════════════════
           SCREEN 1: BOOK SELECTION
           ══════════════════════════════════════ */
        #book-screen {
            align-items: center;
            padding-top: 64px;
            padding-bottom: 64px;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 48px;
        }
        .logo-mark {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
        }
        .logo-text {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--dark);
            letter-spacing: -0.5px;
        }
        .logo-text span { color: var(--teal); }
        .logo-sub {
            font-size: 14px;
            color: var(--gray);
            margin-top: 4px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .section-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 22px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 36px;
            color: var(--dark-soft);
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
            width: 100%;
        }

        .book-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--card-shadow);
            cursor: pointer;
            transition: transform var(--transition), box-shadow var(--transition);
        }
        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--card-shadow-hover);
        }
        .book-card:active {
            transform: translateY(-1px);
        }

        .book-cover {
            width: 100%;
            aspect-ratio: 3 / 4;
            background: linear-gradient(135deg, var(--teal), var(--teal-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .book-cover .fallback-emoji {
            font-size: 56px;
        }

        .book-meta {
            padding: 16px;
        }
        .book-meta h3 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
            color: var(--dark);
        }
        .book-meta p {
            font-size: 13px;
            color: var(--gray);
        }

        /* ══════════════════════════════════════
           SCREEN 2: PERSONA SELECTION
           ══════════════════════════════════════ */
        #persona-screen {
            padding-top: 32px;
            padding-bottom: 64px;
        }

        .persona-header {
            text-align: center;
            margin-bottom: 40px;
            margin-top: 16px;
        }
        .persona-book-cover {
            width: 100px;
            height: 133px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            margin: 0 auto 16px;
            box-shadow: var(--card-shadow);
        }
        .persona-book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .persona-book-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .persona-book-author {
            font-size: 14px;
            color: var(--gray);
            margin-bottom: 24px;
        }

        .persona-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            width: 100%;
        }

        .persona-card {
            background: var(--white);
            border: 2px solid transparent;
            border-radius: var(--radius);
            padding: 20px;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }
        .persona-card:hover {
            border-color: var(--teal);
            box-shadow: var(--card-shadow-hover);
        }
        .persona-card:active {
            transform: scale(0.98);
        }

        .persona-emoji {
            font-size: 36px;
            flex-shrink: 0;
            width: 52px;
            height: 52px;
            background: var(--teal-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .persona-card[data-type="guide"] .persona-emoji {
            background: var(--orange-light);
        }

        .persona-info h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .persona-info .persona-type {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--teal-dark);
            font-weight: 600;
            margin-bottom: 6px;
        }
        .persona-card[data-type="guide"] .persona-type {
            color: var(--orange);
        }
        .persona-info p {
            font-size: 13px;
            color: var(--gray);
            line-height: 1.4;
        }

        /* ══════════════════════════════════════
           SCREEN 3: PLAYER + VOICE CHAT
           ══════════════════════════════════════ */
        #player-screen {
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
        }

        .player-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top bar */
        .player-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            flex-shrink: 0;
            background: var(--white);
        }
        .player-topbar-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }
        .player-topbar-cover {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .player-topbar-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .player-topbar-text h3 {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-topbar-text p {
            font-size: 12px;
            color: var(--gray);
        }

        .persona-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--teal-light);
            padding: 4px 12px 4px 6px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: var(--teal-dark);
            flex-shrink: 0;
        }
        .persona-badge .badge-emoji {
            font-size: 18px;
        }

        /* Audio Player */
        .audio-player-bar {
            padding: 12px 24px 8px;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            flex-shrink: 0;
            background: var(--white);
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }

        .player-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--dark);
            padding: 6px;
            border-radius: 50%;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .player-btn:hover { background: rgba(0,0,0,0.05); }
        .player-btn svg { width: 22px; height: 22px; }

        .play-btn {
            width: 48px;
            height: 48px;
            background: var(--teal) !important;
            border-radius: 50%;
            color: white;
        }
        .play-btn:hover { background: var(--teal-dark) !important; }
        .play-btn svg { width: 24px; height: 24px; }

        .progress-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .progress-time {
            font-size: 11px;
            color: var(--gray);
            font-variant-numeric: tabular-nums;
            min-width: 36px;
        }
        .progress-bar-container {
            flex: 1;
            height: 4px;
            background: rgba(0,0,0,0.08);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--teal);
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .chapter-select-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }
        .chapter-label {
            font-size: 12px;
            color: var(--gray);
        }
        .chapter-select {
            font-size: 12px;
            font-family: inherit;
            background: var(--bg);
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 6px;
            padding: 4px 8px;
            color: var(--dark);
            cursor: pointer;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--bg);
        }

        .chat-welcome {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray);
        }
        .chat-welcome .welcome-emoji {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .chat-welcome h3 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 18px;
            color: var(--dark-soft);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .chat-welcome p {
            font-size: 14px;
            line-height: 1.5;
        }

        .msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .msg.user {
            align-self: flex-end;
            background: var(--teal);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg.assistant {
            align-self: flex-start;
            background: var(--white);
            color: var(--dark);
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .msg.system-msg {
            align-self: center;
            background: transparent;
            color: var(--gray);
            font-size: 13px;
            font-style: italic;
            padding: 8px;
        }
        .msg .typing-dots {
            display: inline-flex;
            gap: 4px;
            padding: 4px 0;
        }
        .msg .typing-dots span {
            width: 6px;
            height: 6px;
            background: var(--gray-light);
            border-radius: 50%;
            animation: dotBounce 1.2s infinite;
        }
        .msg .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .msg .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotBounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        /* Input Area */
        .input-area {
            padding: 12px 24px 24px;
            border-top: 1px solid rgba(0,0,0,0.06);
            flex-shrink: 0;
            background: var(--white);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .text-input {
            flex: 1;
            font-family: inherit;
            font-size: 15px;
            padding: 12px 16px;
            border: 1.5px solid rgba(0,0,0,0.1);
            border-radius: 24px;
            background: var(--bg);
            color: var(--dark);
            outline: none;
            transition: border-color var(--transition);
        }
        .text-input:focus { border-color: var(--teal); }
        .text-input::placeholder { color: var(--gray-light); }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--teal);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            flex-shrink: 0;
        }
        .send-btn:hover { background: var(--teal-dark); }
        .send-btn:disabled { background: var(--gray-light); cursor: not-allowed; }
        .send-btn svg { width: 20px; height: 20px; }

        .mic-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: var(--orange);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            flex-shrink: 0;
            position: relative;
        }
        .mic-btn:hover { background: #E09520; transform: scale(1.05); }
        .mic-btn.recording {
            background: var(--red-orange);
            animation: micPulse 1.5s infinite;
        }
        .mic-btn.processing {
            background: var(--gray);
            cursor: wait;
        }
        .mic-btn.streaming {
            background: var(--teal);
            animation: none;
        }
        .mic-btn svg { width: 24px; height: 24px; }

        /* Audio bars indicator for streaming playback */
        .audio-bars {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 14px;
            vertical-align: middle;
        }
        .audio-bars span {
            display: inline-block;
            width: 3px;
            background: var(--teal);
            border-radius: 1px;
            animation: barBounce 1s ease-in-out infinite;
        }
        .audio-bars span:nth-child(1) { height: 6px; animation-delay: 0s; }
        .audio-bars span:nth-child(2) { height: 10px; animation-delay: 0.15s; }
        .audio-bars span:nth-child(3) { height: 14px; animation-delay: 0.3s; }
        .audio-bars span:nth-child(4) { height: 8px; animation-delay: 0.45s; }
        @keyframes barBounce {
            0%, 100% { transform: scaleY(0.4); }
            50% { transform: scaleY(1); }
        }

        @keyframes micPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(224, 78, 57, 0.4); }
            50% { box-shadow: 0 0 0 14px rgba(224, 78, 57, 0); }
        }

        .voice-status {
            font-size: 12px;
            color: var(--gray);
            text-align: center;
            min-height: 18px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .voice-status .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--red-orange);
            animation: statusPulse 1s ease-in-out infinite;
        }
        .voice-status .status-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0,0,0,0.1);
            border-top-color: var(--teal);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }
        @keyframes statusPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        /* ── Toast Alert ── */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--dark);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 9999;
            transition: transform 0.4s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .toast.error { background: var(--red-orange); }

        /* ── Loading State ── */
        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(0,0,0,0.08);
            border-top-color: var(--teal);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 40px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── API Error Inline ── */
        .api-error {
            text-align: center;
            padding: 24px 16px;
            color: var(--gray);
            font-size: 14px;
            line-height: 1.6;
        }
        .api-error .error-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: rgba(224, 78, 57, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .api-error .error-icon svg {
            width: 20px;
            height: 20px;
            color: var(--red-orange);
        }
        .api-error .error-title {
            font-weight: 600;
            color: var(--dark-soft);
            margin-bottom: 4px;
        }
        .api-error .error-hint {
            font-size: 13px;
            color: var(--gray);
        }
        .api-error .retry-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 20px;
            background: var(--teal);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition);
        }
        .api-error .retry-btn:hover {
            background: var(--teal-dark);
        }

        /* ── Audio Buffering ── */
        .play-btn.buffering {
            position: relative;
        }
        .play-btn.buffering::after {
            content: '';
            position: absolute;
            inset: -4px;
            border: 2.5px solid transparent;
            border-top-color: var(--orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .progress-bar-container.buffering .progress-bar-fill {
            animation: bufferPulse 1.5s ease-in-out infinite;
        }
        @keyframes bufferPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            #book-screen { padding-top: 40px; }
            .books-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
            .persona-grid { grid-template-columns: 1fr; }
            .logo-text { font-size: 26px; }
            .section-title { font-size: 18px; }
            .msg { max-width: 88%; }
        }

        @media (max-width: 380px) {
            .books-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .book-meta h3 { font-size: 14px; }
        }
    </style>
</head>
<body>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- ═══ SCREEN 1: BOOK SELECTION ═══ -->
<div id="book-screen" class="screen active">
    <div class="screen-content">
        <div class="logo-area">
            <!-- Inline book icon in brand colors -->
            <svg class="logo-mark" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M36 14 C28 14 20 18 18 22 L18 56 C20 52 28 48 36 48" fill="#F5A623" stroke="#F5A623" stroke-width="1"/>
                <path d="M36 14 C44 14 52 18 54 22 L54 56 C52 52 44 48 36 48" fill="#E04E39" stroke="#E04E39" stroke-width="1"/>
                <line x1="24" y1="26" x2="34" y2="26" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                <line x1="24" y1="31" x2="32" y2="31" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                <line x1="24" y1="36" x2="33" y2="36" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                <line x1="38" y1="26" x2="48" y2="26" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                <line x1="38" y1="31" x2="46" y2="31" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                <line x1="38" y1="36" x2="47" y2="36" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
            </svg>
            <div class="logo-text">echo<span>Wright</span></div>
            <div class="logo-sub">Audiobooks</div>
        </div>

        <h2 class="section-title">Choose a book to explore</h2>

        <div id="books-container" class="books-grid">
            <div class="loading-spinner"></div>
        </div>
    </div>
</div>

<!-- ═══ SCREEN 2: PERSONA SELECTION ═══ -->

<!-- Hidden audio element -->
<audio id="audio-player" preload="auto"></audio>

<script>
// ═══════════════════════════════════════════
// CONFIGURATION
// ═══════════════════════════════════════════
const API_URL = window.APP_CONFIG?.API_URL || 'http://localhost:8000';
const LLM_URL = window.APP_CONFIG?.LLM_URL || 'http://localhost:8002';

// Demo auth token (auto-login)
let token = null;

// ─── State ───
let selectedBook = null;
let selectedPersona = null;
let chatHistory = [];
let audioPlayer = document.getElementById('audio-player');
let currentChapter = 0;
let chapters = [];
let isPlaying = false;
let voiceState = 'idle'; // idle | recording | processing
let mediaRecorder = null;
let audioChunks = [];
let useStreaming = true;

// ─── Book Data (fallback if API unavailable) ───
const FALLBACK_BOOKS = [
    { id: 'the-great-gatsby', title: 'The Great Gatsby', author: 'F. Scott Fitzgerald', chapters: 9, emoji: '🥂' },
    { id: 'moby-dick', title: 'Moby Dick', author: 'Herman Melville', chapters: 47, emoji: '🐋' },
    { id: 'alices-adventures-in-wonderland', title: "Alice's Adventures in Wonderland", author: 'Lewis Carroll', chapters: 12, emoji: '🐰' },
    { id: 'war-and-peace', title: 'War and Peace', author: 'Leo Tolstoy', chapters: 50, emoji: '⚔️' },
    { id: 'odyssey', title: 'Odyssey', author: 'Homer', chapters: 24, emoji: '🏛️' },
    { id: 'pride-and-prejudice', title: 'Pride and Prejudice', author: 'Jane Austen', chapters: 61, emoji: '💌' }
];

const CHAPTER_COUNTS = {
    'The Great Gatsby': 9,
    'Pride and Prejudice': 61,
    'Moby Dick': 47,
    "Alice's Adventures in Wonderland": 12,
    'War and Peace': 50,
    'Odyssey': 24
};

// ─── Cover image mapping ───
function getCoverUrl(bookTitle) {
    const covers = {
        'The Great Gatsby': `${API_URL}/books/cover/The%20Great%20Gatsby/cover.jpg`,
        'Moby Dick': `${API_URL}/books/cover/Moby%20Dick/cover.jpg`,
        "Alice's Adventures in Wonderland": `${API_URL}/books/cover/Alice's%20Adventures%20in%20Wonderland/cover.jpg`,
        'War and Peace': `${API_URL}/books/cover/War%20and%20Peace/cover.jpg`,
        'Odyssey': `${API_URL}/books/cover/Odyssey/cover.jpg`,
        'Pride and Prejudice': `${API_URL}/books/cover/Pride%20and%20Prejudice/cover.jpg`
    };
    return covers[bookTitle] || '';
}

function getBookEmoji(title) {
    const t = title.toLowerCase();
    if (t.includes('gatsby')) return '🥂';
    if (t.includes('moby')) return '🐋';
    if (t.includes('alice')) return '🐰';
    if (t.includes('war')) return '⚔️';
    if (t.includes('odyssey')) return '🏛️';
    if (t.includes('pride')) return '💌';
    return '📚';
}

function getPersonaEmoji(name) {
    const n = name.toLowerCase();
    if (n.includes('gatsby')) return '🎩';
    if (n.includes('nick')) return '📝';
    if (n.includes('daisy')) return '🌸';
    if (n.includes('jordan')) return '🏌️';
    if (n.includes('ahab')) return '⚓';
    if (n.includes('ishmael')) return '🚢';
    if (n.includes('alice')) return '🐰';
    if (n.includes('cheshire')) return '😸';
    if (n.includes('teacher') || n.includes('professor')) return '📚';
    if (n.includes('tutor')) return '🎓';
    if (n.includes('narrator')) return '🎙️';
    if (n.includes('historian')) return '📜';
    return '🎭';
}

// ═══════════════════════════════════════════
// SCREEN MANAGEMENT
// ═══════════════════════════════════════════
function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const screen = document.getElementById(screenId);
    screen.classList.add('active');
}

// ═══════════════════════════════════════════
// AUTO DEMO LOGIN
// ═══════════════════════════════════════════
async function autoLogin() {
    const DEMO_EMAIL = 'demo@betterbooks.app';
    const DEMO_PASS = 'demopass123';

    try {
        // Try to sign in
        let res = await fetch(`${API_URL}/auth/signin`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: DEMO_EMAIL, password: DEMO_PASS })
        });

        if (!res.ok) {
            // Sign up if sign in fails
            res = await fetch(`${API_URL}/auth/signup`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: 'Demo User', email: DEMO_EMAIL, password: DEMO_PASS })
            });
        }

        if (res.ok) {
            const data = await res.json();
            token = data.access_token;
        }
    } catch (e) {
        console.log('Auto-login failed, running without auth:', e.message);
    }
}

// ═══════════════════════════════════════════
// SCREEN 1: LOAD BOOKS
// ═══════════════════════════════════════════
async function loadBooks() {
    let books = FALLBACK_BOOKS;
    let apiReachable = true;

    try {
        const res = await fetch(`${API_URL}/bookstore/browse`);
        if (res.ok) {
            const data = await res.json();
            if (data.books && data.books.length > 0) {
                books = data.books.map(b => ({
                    ...b,
                    chapters: CHAPTER_COUNTS[b.title] || 10,
                    emoji: getBookEmoji(b.title)
                }));
            }
        }
    } catch (e) {
        apiReachable = false;
        console.log('Using fallback book data');
    }

    const container = document.getElementById('books-container');

    // Show connection warning above the grid if API is unreachable
    let errorBanner = document.getElementById('api-error-banner');
    if (!apiReachable) {
        if (!errorBanner) {
            errorBanner = document.createElement('div');
            errorBanner.id = 'api-error-banner';
            errorBanner.className = 'api-error';
            container.parentElement.insertBefore(errorBanner, container);
        }
        errorBanner.innerHTML = `
            <div class="error-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
            </div>
            <div class="error-title">Could not reach the server</div>
            <div class="error-hint">Make sure the API is running on port 8000. Showing offline catalog.</div>
            <button class="retry-btn" onclick="retryLoadBooks()">Retry Connection</button>
        `;
    } else if (errorBanner) {
        errorBanner.remove();
    }

    container.innerHTML = books.map(book => {
        const coverUrl = book.cover_image_url || getCoverUrl(book.title);
        return `
            <div class="book-card" onclick="selectBook(${escapeAttr(JSON.stringify(book))})">
                <div class="book-cover">
                    ${coverUrl
                        ? `<img src="${escapeHtml(coverUrl)}" alt="${escapeHtml(book.title)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="fallback-emoji" style="display:none">${book.emoji || '📚'}</span>`
                        : `<span class="fallback-emoji">${book.emoji || '📚'}</span>`
                    }
                </div>
                <div class="book-meta">
                    <h3>${escapeHtml(book.title)}</h3>
                    <p>${escapeHtml(book.author)}</p>
                </div>
            </div>
        `;
    }).join('');
}

function retryLoadBooks() {
    const banner = document.getElementById('api-error-banner');
    if (banner) banner.innerHTML = '<div class="loading-spinner" style="margin:16px auto"></div>';
    loadBooks();
}

function selectBook(book) {
    selectedBook = book;
    loadPersonas(book);
    showScreen('persona-screen');
}

// ═══════════════════════════════════════════
// SCREEN 2: LOAD PERSONAS
// ═══════════════════════════════════════════
async function loadPersonas(book) {
    // Set book info in header
    const coverUrl = book.cover_image_url || getCoverUrl(book.title);
    document.getElementById('persona-book-title').textContent = book.title;
    document.getElementById('persona-book-author').textContent = book.author;

    const coverEl = document.getElementById('persona-book-cover');
    if (coverUrl) {
        coverEl.innerHTML = `<img src="${escapeHtml(coverUrl)}" alt="${escapeHtml(book.title)}" onerror="this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:var(--teal-light);font-size:36px\\'>${book.emoji || '📚'}</div>'">`;
    } else {
        coverEl.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:var(--teal-light);font-size:36px">${book.emoji || '📚'}</div>`;
    }

    const container = document.getElementById('persona-container');
    container.innerHTML = '<div class="loading-spinner"></div>';

    let personas = [];
    let personaApiFailed = false;
    try {
        const res = await fetch(`${API_URL}/ai/personas/${encodeURIComponent(book.title)}`);
        if (res.ok) {
            const data = await res.json();
            personas = data.personas || [];
        }
    } catch (e) {
        personaApiFailed = true;
        console.log('Persona load failed, using fallback');
    }

    // Fallback personas if none loaded
    if (personas.length === 0) {
        personas = [
            { id: 'english-teacher', name: 'English Teacher', type: 'guide', description: 'An insightful guide who helps you understand themes, symbols, and literary techniques.' },
            { id: 'narrator', name: 'Narrator', type: 'character', description: 'Experience the story through the voice of the narrator, bringing the text to life.' }
        ];
    }

    let personaErrorHtml = '';
    if (personaApiFailed) {
        personaErrorHtml = `
            <div class="api-error" style="grid-column: 1 / -1; padding: 12px 0;">
                <div class="error-hint">Could not load personas from the server. Showing defaults.</div>
            </div>
        `;
    }

    container.innerHTML = personaErrorHtml + personas.map(p => `
        <div class="persona-card" data-type="${p.type || 'character'}" onclick="selectPersona(${escapeAttr(JSON.stringify(p))})">
            <div class="persona-emoji">${getPersonaEmoji(p.name)}</div>
            <div class="persona-info">
                <div class="persona-type">${p.type === 'guide' ? 'Guide' : 'Character'}</div>
                <h3>${escapeHtml(p.name)}</h3>
                <p>${escapeHtml(p.description || '')}</p>
            </div>
        </div>
    `).join('');
}

function selectPersona(persona) {
    selectedPersona = persona;
    enterPlayer();
}

// ═══════════════════════════════════════════
// SCREEN 3: PLAYER + CHAT
// ═══════════════════════════════════════════
function enterPlayer() {
    // Reset chat
    chatHistory = [];
    const chatArea = document.getElementById('chat-area');
    chatArea.innerHTML = '';

    // Set top bar info
    const coverUrl = selectedBook.cover_image_url || getCoverUrl(selectedBook.title);
    document.getElementById('player-title').textContent = selectedBook.title;
    document.getElementById('player-author').textContent = selectedBook.author;

    const coverEl = document.getElementById('player-cover');
    coverEl.innerHTML = coverUrl
        ? `<img src="${escapeHtml(coverUrl)}" alt="" onerror="this.parentElement.innerHTML='${selectedBook.emoji || '📚'}'"/>`
        : selectedBook.emoji || '📚';

    // Persona badge
    const badge = document.getElementById('player-persona-badge');
    badge.querySelector('.badge-emoji').textContent = getPersonaEmoji(selectedPersona.name);
    badge.querySelector('.badge-name').textContent = selectedPersona.name;

    // Welcome message
    const welcomeHtml = `
        <div class="chat-welcome" id="chat-welcome">
            <div class="welcome-emoji">${getPersonaEmoji(selectedPersona.name)}</div>
            <h3>Chatting as ${escapeHtml(selectedPersona.name)}</h3>
            <p>Press play to start listening. Ask me anything about ${escapeHtml(selectedBook.title)} - I'll keep it spoiler-free based on where you are.</p>
        </div>
    `;
    chatArea.innerHTML = welcomeHtml;

    // Load chapters
    loadChapters();

    showScreen('player-screen');
}

function leavePlayer() {
    if (audioPlayer) {
        audioPlayer.pause();
    }
    disconnectVoiceWs();
    isPlaying = false;
    updatePlayButton();
    setVoiceState('idle');
    showScreen('persona-screen');
}

async function loadChapters() {
    chapters = [];
    const select = document.getElementById('chapter-select');
    select.innerHTML = '';

    // Try to fetch real chapter list from backend
    try {
        const resp = await fetch(`${API_URL}/books/${encodeURIComponent(selectedBook.title)}/chapters`);
        if (resp.ok) {
            const data = await resp.json();
            if (data.chapters && data.chapters.length > 0) {
                data.chapters.forEach((ch, idx) => {
                    chapters.push({
                        number: ch.chapter_number || idx + 1,
                        title: ch.title || `Chapter ${idx + 1}`,
                        audioUrl: `${API_URL}/audio/${encodeURIComponent(selectedBook.title)}/${encodeURIComponent(ch.filename)}`
                    });
                    const opt = document.createElement('option');
                    opt.value = idx;
                    opt.textContent = ch.title || `Chapter ${idx + 1}`;
                    select.appendChild(opt);
                });
                currentChapter = 0;
                loadChapter(0);
                return;
            }
        }
    } catch (e) {
        console.warn('Failed to fetch chapters from API, using fallback:', e);
    }

    // Fallback: generate chapter list from known counts
    const count = selectedBook.chapters || CHAPTER_COUNTS[selectedBook.title] || 10;
    for (let i = 1; i <= count; i++) {
        chapters.push({
            number: i,
            title: `Chapter ${i}`,
            audioUrl: `${API_URL}/audio/${encodeURIComponent(selectedBook.title)}/${encodeURIComponent('Chapter ' + i + '.mp3')}`
        });
        const opt = document.createElement('option');
        opt.value = i - 1;
        opt.textContent = `Chapter ${i}`;
        select.appendChild(opt);
    }

    currentChapter = 0;
    loadChapter(0);
}

function loadChapter(index) {
    if (index < 0 || index >= chapters.length) return;
    currentChapter = index;
    document.getElementById('chapter-select').value = index;

    audioPlayer.src = chapters[index].audioUrl;
    audioPlayer.load();

    document.getElementById('current-time').textContent = '0:00';
    document.getElementById('progress-fill').style.width = '0%';
}

function changeChapter(val) {
    const idx = parseInt(val);
    if (isNaN(idx)) return;
    loadChapter(idx);
    if (isPlaying) {
        audioPlayer.play().catch(() => {});
    }
}

// ─── Audio Controls ───
function togglePlay() {
    if (isPlaying) {
        audioPlayer.pause();
    } else {
        audioPlayer.play().catch(err => {
            showToast('Unable to play audio. Check if the server is running.', true);
        });
    }
}

function skipForward() {
    audioPlayer.currentTime = Math.min(audioPlayer.currentTime + 30, audioPlayer.duration || 0);
}

function skipBackward() {
    audioPlayer.currentTime = Math.max(audioPlayer.currentTime - 10, 0);
}

function seekAudio(event) {
    const bar = document.getElementById('progress-bar');
    const rect = bar.getBoundingClientRect();
    const percent = (event.clientX - rect.left) / rect.width;
    if (audioPlayer.duration) {
        audioPlayer.currentTime = percent * audioPlayer.duration;
    }
}

function updatePlayButton() {
    document.getElementById('play-icon').style.display = isPlaying ? 'none' : 'block';
    document.getElementById('pause-icon').style.display = isPlaying ? 'block' : 'none';
}

function formatTime(sec) {
    if (!sec || isNaN(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
}

// Audio events
audioPlayer.addEventListener('timeupdate', () => {
    const ct = audioPlayer.currentTime;
    const dur = audioPlayer.duration;
    document.getElementById('current-time').textContent = formatTime(ct);
    if (dur) {
        document.getElementById('progress-fill').style.width = `${(ct / dur) * 100}%`;
    }
});

audioPlayer.addEventListener('loadedmetadata', () => {
    document.getElementById('duration-time').textContent = formatTime(audioPlayer.duration);
});

audioPlayer.addEventListener('play', () => {
    isPlaying = true;
    updatePlayButton();
});

audioPlayer.addEventListener('pause', () => {
    isPlaying = false;
    updatePlayButton();
});

audioPlayer.addEventListener('ended', () => {
    if (currentChapter < chapters.length - 1) {
        loadChapter(currentChapter + 1);
        audioPlayer.play().catch(() => {});
    } else {
        isPlaying = false;
        updatePlayButton();
    }
});

audioPlayer.addEventListener('error', () => {
    console.log('Audio load error for chapter', currentChapter + 1);
    setAudioBuffering(false);
    showToast('Audio not available for this chapter.', true);
});

// Audio buffering state
function setAudioBuffering(buffering) {
    const playBtn = document.getElementById('play-btn');
    const progressBar = document.getElementById('progress-bar');
    if (buffering) {
        playBtn.classList.add('buffering');
        progressBar.classList.add('buffering');
    } else {
        playBtn.classList.remove('buffering');
        progressBar.classList.remove('buffering');
    }
}

audioPlayer.addEventListener('waiting', () => {
    setAudioBuffering(true);
});

audioPlayer.addEventListener('canplay', () => {
    setAudioBuffering(false);
});

audioPlayer.addEventListener('playing', () => {
    setAudioBuffering(false);
});

audioPlayer.addEventListener('stalled', () => {
    if (isPlaying) setAudioBuffering(true);
});

// ═══════════════════════════════════════════
// TEXT CHAT
// ═══════════════════════════════════════════
function addMessage(role, content) {
    // Remove welcome message
    const welcome = document.getElementById('chat-welcome');
    if (welcome) welcome.remove();

    const chatArea = document.getElementById('chat-area');
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;
    msg.textContent = content;
    chatArea.appendChild(msg);
    chatArea.scrollTop = chatArea.scrollHeight;
    return msg;
}

function addTypingIndicator() {
    const welcome = document.getElementById('chat-welcome');
    if (welcome) welcome.remove();

    const chatArea = document.getElementById('chat-area');
    const msg = document.createElement('div');
    msg.className = 'msg assistant';
    msg.id = 'typing-indicator';
    msg.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    chatArea.appendChild(msg);
    chatArea.scrollTop = chatArea.scrollHeight;
    return msg;
}

function removeTypingIndicator() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
}

let isSendingMessage = false;

async function sendTextMessage() {
    if (isSendingMessage) return;

    const input = document.getElementById('text-input');
    const message = input.value.trim();
    if (!message) return;

    isSendingMessage = true;
    const sendBtn = document.getElementById('send-btn');
    if (sendBtn) sendBtn.disabled = true;
    input.disabled = true;

    input.value = '';
    addMessage('user', message);

    const typingEl = addTypingIndicator();

    try {
        const chatContext = {
            chapter: currentChapter + 1,
            timestamp: audioPlayer.currentTime || 0
        };

        const priorHistory = chatHistory.slice(-10);

        const body = {
            book_id: selectedBook.title,
            chapter: chatContext.chapter,
            timestamp_seconds: chatContext.timestamp,
            persona_id: selectedPersona?.id || 'english-teacher',
            message: message,
            conversation_history: priorHistory,
            stream: useStreaming
        };

        chatHistory.push({ role: 'user', content: message });

        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;

        const res = await fetch(`${API_URL}/ai/chat`, {
            method: 'POST',
            headers,
            body: JSON.stringify(body)
        });

        removeTypingIndicator();

        if (!res.ok) {
            addMessage('system-msg', "The server returned an error. Make sure all services are running.");
            return;
        }

        const contentType = res.headers.get('content-type') || '';
        if (contentType.includes('text/event-stream')) {
            const msgEl = addMessage('assistant', '');
            let fullContent = '';

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let streamDone = false;

            while (!streamDone) {
                const { done, value } = await reader.read();
                if (done) break;

                const text = decoder.decode(value, { stream: true });
                const lines = text.split('\n');

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.slice(6));
                            if (data.error) {
                                fullContent = data.error;
                                msgEl.textContent = fullContent;
                                streamDone = true;
                                break;
                            }
                            if (data.content) {
                                fullContent += data.content;
                                msgEl.textContent = fullContent;
                                document.getElementById('chat-area').scrollTop = document.getElementById('chat-area').scrollHeight;
                            }
                            if (data.done) {
                                streamDone = true;
                                break;
                            }
                        } catch (e) {}
                    }
                }
            }

            if (fullContent) {
                chatHistory.push({ role: 'assistant', content: fullContent });
            }
        } else {
            const data = await res.json();
            const reply = data.message || data.content || data.response || 'No response.';
            addMessage('assistant', reply);
            chatHistory.push({ role: 'assistant', content: reply });
        }

    } catch (err) {
        removeTypingIndicator();
        const errorMsg = err.message && err.message.includes('Failed to fetch')
            ? "Could not reach the server. Make sure the API is running on port 8000."
            : "Something went wrong processing your message. Please try again.";
        addMessage('system-msg', errorMsg);
    } finally {
        isSendingMessage = false;
        const sendBtn = document.getElementById('send-btn');
        if (sendBtn) sendBtn.disabled = false;
        const input = document.getElementById('text-input');
        if (input) input.disabled = false;
        if (input) input.focus();
    }
}

// ═══════════════════════════════════════════
// VOICE CHAT
// ═══════════════════════════════════════════
function setVoiceState(state) {
    voiceState = state;
    const btn = document.getElementById('mic-btn');
    const micIcon = document.getElementById('mic-icon');
    const stopIcon = document.getElementById('mic-stop-icon');
    const status = document.getElementById('voice-status');

    btn.classList.remove('recording', 'processing', 'streaming');
    micIcon.style.display = 'block';
    stopIcon.style.display = 'none';

    switch (state) {
        case 'idle':
            status.innerHTML = '';
            break;
        case 'recording':
            btn.classList.add('recording');
            micIcon.style.display = 'none';
            stopIcon.style.display = 'block';
            status.innerHTML = '<span class="status-dot"></span> Recording...';
            break;
        case 'processing':
            btn.classList.add('processing');
            status.innerHTML = '<span class="status-spinner"></span> Transcribing...';
            break;
        case 'streaming':
            btn.classList.add('streaming');
            status.innerHTML = '<div class="audio-bars"><span></span><span></span><span></span><span></span></div> Streaming response...';
            break;
    }
}

async function toggleVoiceChat() {
    if (voiceState === 'recording') {
        stopRecording();
    } else if (voiceState === 'idle') {
        initAudioContext();
        startRecording();
    } else if (voiceState === 'processing' || voiceState === 'streaming') {
        // Allow canceling a stuck interaction
        disconnectVoiceWs();
        resetVoicePlayback();
        voiceStreamingMsgEl = null;
        voiceStreamingText = '';
        setVoiceState('idle');
    }
}

async function startRecording() {
    if (!navigator.mediaDevices || !window.MediaRecorder) {
        showToast('Voice chat is not supported in this browser.', true);
        return;
    }
    let stream;
    try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
        showToast('Microphone access is required for voice chat.', true);
        return;
    }

    try {
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            setVoiceState('processing');
            await sendVoiceViaWs(audioBlob);
        };

        mediaRecorder.start();
        setVoiceState('recording');

        // Auto-stop after 30 seconds
        if (window._recordingTimeout) clearTimeout(window._recordingTimeout);
        window._recordingTimeout = setTimeout(() => {
            if (voiceState === 'recording') stopRecording();
        }, 30000);

    } catch (err) {
        // MediaRecorder construction failed - clean up the stream
        stream.getTracks().forEach(t => t.stop());
        showToast('Could not start recording.', true);
    }
}

function stopRecording() {
    if (window._recordingTimeout) clearTimeout(window._recordingTimeout);
    if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
    }
}

// ---- WebSocket Voice Chat ----
let voiceWs = null;
let voiceAudioContext = null;
let voiceAudioQueue = [];
let voiceIsPlaying = false;
let voiceNextPlayTime = 0;
let voiceStreamingMsgEl = null;
let voiceStreamingText = '';

function getWsUrl() {
    const loc = new URL(API_URL);
    const proto = loc.protocol === 'https:' ? 'wss:' : 'ws:';
    let url = `${proto}//${loc.host}/ws/voice`;
    if (token) url += `?token=${encodeURIComponent(token)}`;
    return url;
}

function connectVoiceWs() {
    return new Promise((resolve, reject) => {
        if (voiceWs && voiceWs.readyState === WebSocket.OPEN) {
            resolve();
            return;
        }
        const ws = new WebSocket(getWsUrl());
        ws.onopen = () => {
            voiceWs = ws;
            // Send config
            ws.send(JSON.stringify({
                type: 'config',
                book_id: selectedBook ? selectedBook.title : null,
                chapter: currentChapter + 1,
                persona_id: selectedPersona ? selectedPersona.id : null,
                timestamp: Math.floor(audioPlayer.currentTime || 0)
            }));
            resolve();
        };
        ws.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);
                handleVoiceWsMessage(msg);
            } catch (e) {
                console.error('Voice WS parse error:', e);
            }
        };
        ws.onerror = (err) => {
            console.error('Voice WS error:', err);
            reject(err);
        };
        ws.onclose = () => {
            voiceWs = null;
            // Reset UI if we were mid-interaction
            if (voiceState === 'processing' || voiceState === 'streaming') {
                voiceStreamingMsgEl = null;
                voiceStreamingText = '';
                setVoiceState('idle');
            }
        };
    });
}

function disconnectVoiceWs() {
    if (voiceWs) {
        voiceWs.close();
        voiceWs = null;
    }
}

function handleVoiceWsMessage(msg) {
    switch (msg.type) {
        case 'transcription':
            addMessage('user', msg.text);
            chatHistory.push({ role: 'user', content: msg.text });
            // LLM streaming is about to start
            setVoiceState('streaming');
            voiceStreamingText = '';
            voiceStreamingMsgEl = addMessage('assistant', '');
            break;

        case 'llm_token':
            if (voiceStreamingMsgEl) {
                voiceStreamingText += msg.content;
                voiceStreamingMsgEl.textContent = voiceStreamingText;
                document.getElementById('chat-area').scrollTop = document.getElementById('chat-area').scrollHeight;
            }
            break;

        case 'audio_chunk':
            queueAudioChunk(msg.data);
            break;

        case 'done':
            if (voiceStreamingText) {
                chatHistory.push({ role: 'assistant', content: voiceStreamingText });
            }
            voiceStreamingMsgEl = null;
            voiceStreamingText = '';
            setVoiceState('idle');
            break;

        case 'error':
            addMessage('system-msg', msg.message || 'Voice chat error');
            voiceStreamingMsgEl = null;
            voiceStreamingText = '';
            setVoiceState('idle');
            break;
    }
}

async function sendVoiceViaWs(audioBlob) {
    try {
        await connectVoiceWs();
    } catch (e) {
        setVoiceState('idle');
        addMessage('system-msg', 'Could not connect to voice service. Make sure the API is running.');
        return;
    }

    // Re-send config with latest position each time
    if (voiceWs && voiceWs.readyState === WebSocket.OPEN) {
        voiceWs.send(JSON.stringify({
            type: 'config',
            book_id: selectedBook ? selectedBook.title : null,
            chapter: currentChapter + 1,
            persona_id: selectedPersona ? selectedPersona.id : null,
            timestamp: Math.floor(audioPlayer.currentTime || 0)
        }));
    }

    // Reset audio playback queue for new interaction
    resetVoicePlayback();

    // Convert blob to base64 and send
    const reader = new FileReader();
    reader.onerror = () => {
        setVoiceState('idle');
        addMessage('system-msg', 'Failed to process audio recording.');
    };
    reader.onloadend = () => {
        if (!voiceWs || voiceWs.readyState !== WebSocket.OPEN) {
            setVoiceState('idle');
            addMessage('system-msg', 'Connection lost. Please try again.');
            return;
        }
        try {
            const base64 = reader.result.split(',')[1];
            voiceWs.send(JSON.stringify({ type: 'audio_data', data: base64 }));
        } catch (e) {
            setVoiceState('idle');
            addMessage('system-msg', 'Failed to send audio. Please try again.');
        }
    };
    reader.readAsDataURL(audioBlob);
}

// ---- AudioContext Playback Queue ----

function initAudioContext() {
    if (!voiceAudioContext) {
        voiceAudioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    }
    // Resume if suspended (browsers require user gesture)
    if (voiceAudioContext.state === 'suspended') {
        voiceAudioContext.resume();
    }
}

function resetVoicePlayback() {
    voiceAudioQueue = [];
    voiceIsPlaying = false;
    voiceNextPlayTime = 0;
}

function queueAudioChunk(base64Data) {
    if (!voiceAudioContext) return;

    const binary = atob(base64Data);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    // Each chunk is a complete WAV file (RIFF header + PCM data)
    voiceAudioContext.decodeAudioData(bytes.buffer.slice(0), (audioBuffer) => {
        voiceAudioQueue.push(audioBuffer);
        scheduleBufferedChunks();
    }, (err) => {
        console.warn('Audio decode error:', err);
    });
}

function scheduleBufferedChunks() {
    // Pre-schedule all queued buffers for gapless playback.
    // This avoids the latency of waiting for onended callbacks.
    while (voiceAudioQueue.length > 0) {
        const buffer = voiceAudioQueue.shift();
        const source = voiceAudioContext.createBufferSource();
        source.buffer = buffer;
        source.connect(voiceAudioContext.destination);

        const now = voiceAudioContext.currentTime;
        const startTime = Math.max(now + 0.01, voiceNextPlayTime);
        voiceNextPlayTime = startTime + buffer.duration;

        voiceIsPlaying = true;
        source.onended = () => {
            // Check if there are new chunks that arrived since we last scheduled
            if (voiceAudioQueue.length > 0) {
                scheduleBufferedChunks();
            } else {
                voiceIsPlaying = false;
            }
        };

        source.start(startTime);
    }
}

// UTILITIES
// ═══════════════════════════════════════════
function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function escapeAttr(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
              .replace(/'/g, '&#39;').replace(/"/g, '&quot;').replace(/\\/g, '&#92;');
}

function showToast(message, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}
