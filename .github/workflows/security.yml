# GitHub Actions Security Scanning Workflow
# Comprehensive security analysis and vulnerability detection

name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly security scan on Mondays at 2 AM

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-scanning:
    name: Dependency Vulnerability Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        pip install safety bandit pip-audit
    
    - name: Run Safety check
      continue-on-error: true
      run: |
        echo "🔍 Running Safety dependency vulnerability check..."
        safety check --json --output safety-report.json || true
        safety check --short-report || true
    
    - name: Run pip-audit
      continue-on-error: true
      run: |
        echo "🔍 Running pip-audit vulnerability check..."
        pip-audit --format=json --output=pip-audit-report.json || true
        pip-audit --format=cyclone-dx --output=pip-audit-sbom.json || true
    
    - name: Upload dependency scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-scan-results
        path: |
          safety-report.json
          pip-audit-report.json
          pip-audit-sbom.json

  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install analysis tools
      run: |
        pip install bandit semgrep
    
    - name: Run Bandit security linter
      continue-on-error: true
      run: |
        echo "🔍 Running Bandit security analysis..."
        bandit -r platform/backend/services/ -f json -o bandit-report.json || true
        bandit -r platform/backend/services/ --severity-level medium || true
    
    - name: Run Semgrep analysis
      continue-on-error: true
      run: |
        echo "🔍 Running Semgrep static analysis..."
        semgrep --config=auto platform/backend/services/ --json --output=semgrep-report.json || true
        semgrep --config=p/python --config=p/docker --config=p/secrets platform/backend/services/ || true
    
    - name: Upload static analysis results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: semgrep-report.json
      continue-on-error: true
    
    - name: Upload static analysis artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: static-analysis-results
        path: |
          bandit-report.json
          semgrep-report.json

  container-scanning:
    name: Container Security Scanning
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [api_gateway, context_service, llm_gateway, tts_service]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        echo "🐳 Building ${{ matrix.service }} for security scan..."
        if [ -f "platform/backend/services/${{ matrix.service }}/Dockerfile" ]; then
          # Create a temp dockerfile with correct paths for our repo structure
          cat > temp_dockerfile_${{ matrix.service }} << 'EOF'
        FROM python:3.11-slim
        WORKDIR /app
        
        # Install basic dependencies
        RUN apt-get update && apt-get install -y gcc python3-dev && rm -rf /var/lib/apt/lists/*
        
        # Copy requirements and install
        COPY platform/backend/services/${{ matrix.service }}/requirements.txt ./
        RUN pip install --no-cache-dir -r requirements.txt || echo "No requirements file or installation failed"
        
        # Copy service code
        COPY platform/backend/services/${{ matrix.service }}/ /app/
        COPY core/ /app/core/
        
        WORKDIR /app
        EOF
          # Replace the service name placeholder
          sed -i "s/\${{ matrix.service }}/${{ matrix.service }}/g" temp_dockerfile_${{ matrix.service }}
          docker build -t security-scan:${{ matrix.service }} -f temp_dockerfile_${{ matrix.service }} .
        else
          echo "⚠️ Dockerfile not found for ${{ matrix.service }}, creating minimal image for scanning"
          cat > temp_dockerfile_${{ matrix.service }} << 'EOF'
        FROM python:3.11-slim
        WORKDIR /app
        COPY platform/backend/services/${{ matrix.service }}/ /app/
        COPY core/ /app/core/
        EOF
          sed -i "s/\${{ matrix.service }}/${{ matrix.service }}/g" temp_dockerfile_${{ matrix.service }}
          docker build -t security-scan:${{ matrix.service }} -f temp_dockerfile_${{ matrix.service }} .
        fi
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: security-scan:${{ matrix.service }}
        format: 'sarif'
        output: 'trivy-${{ matrix.service }}.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
    
    - name: Upload Trivy scan results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('trivy-${{ matrix.service }}.sarif') != ''
      with:
        sarif_file: 'trivy-${{ matrix.service }}.sarif'
        category: 'container-${{ matrix.service }}'
      continue-on-error: true
    
    - name: Run Trivy filesystem scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: 'platform/backend/services/${{ matrix.service }}/'
        format: 'sarif'
        output: 'trivy-fs-${{ matrix.service }}.sarif'
        severity: 'CRITICAL,HIGH'
    
    - name: Upload filesystem scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('trivy-fs-${{ matrix.service }}.sarif') != ''
      with:
        sarif_file: 'trivy-fs-${{ matrix.service }}.sarif'
        category: 'filesystem-${{ matrix.service }}'
      continue-on-error: true

  secrets-scanning:
    name: Secrets and Credential Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run TruffleHog secrets scan
      uses: trufflesecurity/trufflehog@main
      if: github.event_name == 'pull_request'
      with:
        path: ./
        base: ${{ github.event.pull_request.base.sha }}
        head: ${{ github.event.pull_request.head.sha }}
        extra_args: --debug --only-verified --fail
      continue-on-error: true
    
    - name: Run TruffleHog full repository scan
      uses: trufflesecurity/trufflehog@main
      if: github.event_name == 'push'
      with:
        path: ./
        extra_args: --debug --only-verified --fail
      continue-on-error: true
    
    - name: Run GitLeaks secrets scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  mobile-security:
    name: Mobile App Security Analysis
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'platform/mobile/') || github.event_name == 'schedule'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.1.0'
    
    - name: Flutter security analysis
      run: |
        cd platform/mobile/mobile_app/
        flutter pub get
        
        echo "🔍 Checking for known security issues in Flutter dependencies..."
        flutter pub deps --json > dependencies.json
        
        # Check for common security issues
        echo "🔍 Running Flutter security checks..."
        flutter analyze --no-fatal-infos --no-fatal-warnings
    
    - name: Check Android permissions
      run: |
        echo "🔍 Analyzing Android permissions..."
        if [ -f "platform/mobile/mobile_app/android/app/src/main/AndroidManifest.xml" ]; then
          grep -n "android.permission" platform/mobile/mobile_app/android/app/src/main/AndroidManifest.xml || echo "No explicit permissions found"
        fi
    
    - name: Check iOS permissions
      run: |
        echo "🔍 Analyzing iOS permissions..."
        if [ -f "platform/mobile/mobile_app/ios/Runner/Info.plist" ]; then
          grep -A 1 -B 1 "Usage" platform/mobile/mobile_app/ios/Runner/Info.plist || echo "No usage descriptions found"
        fi

  infrastructure-scanning:
    name: Infrastructure Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Checkov on Terraform files
      uses: bridgecrewio/checkov-action@master
      if: hashFiles('**/*.tf') != ''
      with:
        directory: .
        framework: terraform
        output_format: sarif
        output_file_path: checkov-terraform.sarif
        quiet: true
        soft_fail: true
    
    - name: Run Checkov on Kubernetes manifests
      uses: bridgecrewio/checkov-action@master
      if: hashFiles('**/*.yaml', '**/*.yml') != ''
      with:
        directory: .
        framework: kubernetes
        output_format: sarif
        output_file_path: checkov-k8s.sarif
        quiet: true
        soft_fail: true
    
    - name: Run Checkov on Docker files
      uses: bridgecrewio/checkov-action@master
      if: hashFiles('**/Dockerfile*') != ''
      with:
        directory: .
        framework: dockerfile
        output_format: sarif
        output_file_path: checkov-docker.sarif
        quiet: true
        soft_fail: true
    
    - name: Upload infrastructure scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('checkov-terraform.sarif') != ''
      with:
        sarif_file: checkov-terraform.sarif
        category: 'infrastructure-terraform'
      continue-on-error: true
    
    - name: Upload Kubernetes scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('checkov-k8s.sarif') != ''
      with:
        sarif_file: checkov-k8s.sarif
        category: 'infrastructure-kubernetes'
      continue-on-error: true
    
    - name: Upload Docker scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('checkov-docker.sarif') != ''
      with:
        sarif_file: checkov-docker.sarif
        category: 'infrastructure-docker'
      continue-on-error: true

  security-report:
    name: Security Report Summary
    runs-on: ubuntu-latest
    needs: [dependency-scanning, static-analysis, container-scanning, secrets-scanning]
    if: always()
    
    steps:
    - name: Download all scan results
      uses: actions/download-artifact@v4
      with:
        path: scan-results/
    
    - name: Generate security summary
      run: |
        echo "# 🔒 Security Scan Summary" > security-summary.md
        echo "" >> security-summary.md
        echo "**Scan Date:** $(date -u)" >> security-summary.md
        echo "**Commit:** ${{ github.sha }}" >> security-summary.md
        echo "**Branch:** ${{ github.ref_name }}" >> security-summary.md
        echo "" >> security-summary.md
        
        echo "## Scan Results:" >> security-summary.md
        echo "" >> security-summary.md
        
        # Check if scan files exist and provide status
        if [ -f "scan-results/dependency-scan-results/safety-report.json" ]; then
          echo "- ✅ Dependency Vulnerability Scan: Completed" >> security-summary.md
        else
          echo "- ❌ Dependency Vulnerability Scan: Failed or Incomplete" >> security-summary.md
        fi
        
        if [ -f "scan-results/static-analysis-results/bandit-report.json" ]; then
          echo "- ✅ Static Code Analysis: Completed" >> security-summary.md
        else
          echo "- ❌ Static Code Analysis: Failed or Incomplete" >> security-summary.md
        fi
        
        echo "- ✅ Container Security Scan: Completed" >> security-summary.md
        echo "- ✅ Secrets Scanning: Completed" >> security-summary.md
        
        echo "" >> security-summary.md
        echo "## Next Steps:" >> security-summary.md
        echo "1. Review GitHub Security tab for detailed findings" >> security-summary.md
        echo "2. Address any HIGH or CRITICAL vulnerabilities" >> security-summary.md
        echo "3. Update dependencies with known vulnerabilities" >> security-summary.md
        echo "4. Review and rotate any exposed secrets" >> security-summary.md
        
        echo "" >> security-summary.md
        echo "---" >> security-summary.md
        echo "*Automated security scanning by GitHub Actions*" >> security-summary.md
        
        cat security-summary.md
    
    - name: Upload security summary
      uses: actions/upload-artifact@v4
      with:
        name: security-summary
        path: security-summary.md
    
    - name: Comment security summary on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('security-summary.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });