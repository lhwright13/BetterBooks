# GitHub Actions Staging Deployment Workflow
# Automated deployment to staging environment

name: Deploy to Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:  # Allow manual triggering

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  KUBE_NAMESPACE: echowright-staging

jobs:
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0'
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: '1.28.0'
    
    - name: Configure AWS credentials (if using EKS)
      if: contains(secrets.KUBE_CONFIG_DATA, 'aws')
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
    
    - name: Set up kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG_DATA_STAGING }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config
    
    - name: Verify cluster connection
      run: |
        kubectl cluster-info
        kubectl get nodes
    
    - name: Create namespace if not exists
      run: |
        kubectl create namespace ${{ env.KUBE_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
    
    - name: Create/update secrets
      run: |
        kubectl create secret generic app-secrets \
          --from-literal=postgres-password="${{ secrets.POSTGRES_PASSWORD_STAGING }}" \
          --from-literal=redis-password="${{ secrets.REDIS_PASSWORD_STAGING }}" \
          --from-literal=jwt-secret="${{ secrets.JWT_SECRET_KEY_STAGING }}" \
          --from-literal=gemini-api-key="${{ secrets.GEMINI_API_KEY_STAGING }}" \
          --namespace=${{ env.KUBE_NAMESPACE }} \
          --dry-run=client -o yaml | kubectl apply -f -
    
    - name: Deploy to staging
      run: |
        helm upgrade --install echowright-staging ./config/helm/infra/helm/betterbooks/ \
          --namespace ${{ env.KUBE_NAMESPACE }} \
          --create-namespace \
          --set global.imageTag=${{ github.sha }} \
          --set global.environment=staging \
          --set ingress.hosts[0].host=staging.echowright.com \
          --values ./config/helm/values-staging.yaml \
          --wait --timeout=10m
    
    - name: Verify deployment
      run: |
        kubectl rollout status deployment/api-gateway -n ${{ env.KUBE_NAMESPACE }} --timeout=300s
        kubectl rollout status deployment/context-service -n ${{ env.KUBE_NAMESPACE }} --timeout=300s
        kubectl rollout status deployment/llm-gateway -n ${{ env.KUBE_NAMESPACE }} --timeout=300s
        kubectl rollout status deployment/tts-service -n ${{ env.KUBE_NAMESPACE }} --timeout=300s
        kubectl rollout status deployment/transcription-service -n ${{ env.KUBE_NAMESPACE }} --timeout=300s
    
    - name: Run smoke tests
      run: |
        # Wait for services to be ready
        sleep 30
        
        # Get staging URL
        STAGING_URL="https://staging.echowright.com"
        
        # Basic health checks
        curl -f "$STAGING_URL/health" || exit 1
        curl -f "$STAGING_URL/health/ready" || exit 1
        curl -f "$STAGING_URL/api/v1/context/health" || exit 1
        curl -f "$STAGING_URL/api/v1/llm/health" || exit 1
        curl -f "$STAGING_URL/api/v1/tts/health" || exit 1
        curl -f "$STAGING_URL/api/v1/transcription/health" || exit 1
        
        echo "✅ All smoke tests passed!"
    
    - name: Notify deployment status
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: |
          Staging deployment ${{ job.status }}!
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          URL: https://staging.echowright.com
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      
  integration-tests-staging:
    name: Run Integration Tests on Staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install test dependencies
      run: |
        pip install requests pytest
    
    - name: Run integration tests against staging
      env:
        API_BASE_URL: https://staging.echowright.com
      run: |
        python -m pytest tests/integration/ -v --api-url=$API_BASE_URL
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: staging-test-results
        path: test-results/

  performance-tests-staging:
    name: Performance Tests on Staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up k6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6
    
    - name: Run performance tests
      env:
        API_BASE_URL: https://staging.echowright.com
      run: |
        k6 run --env API_BASE_URL=$API_BASE_URL tests/performance/load-test.js
    
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-test-results
        path: k6-report.json