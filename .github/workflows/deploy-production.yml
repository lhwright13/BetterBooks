---
# GitHub Actions Production Deployment Workflow
# Manual deployment to production with approvals and monitoring

name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      confirm_deployment:
        description: 'Type "DEPLOY" to confirm production deployment'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  KUBE_NAMESPACE: echowright-prod

jobs:
  pre-deployment-checks:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate deployment confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm_deployment }}" != "DEPLOY" ]; then
            echo "❌ Deployment confirmation failed. You must type 'DEPLOY' to confirm."
            exit 1
          fi
          echo "✅ Deployment confirmed"
    
      - name: Checkout code
        uses: actions/checkout@v4
    
      - name: Check staging health
        run: |
          # Verify staging is healthy before production deployment
          STAGING_URL="https://staging.echowright.com"
          
          echo "🔍 Checking staging environment health..."
          for endpoint in "/health" "/health/ready" "/api/v1/llm/health"; do
            if ! curl -f -s "$STAGING_URL$endpoint" > /dev/null; then
              echo "❌ Staging endpoint $endpoint is not healthy"
              exit 1
            fi
            echo "✅ $endpoint is healthy"
          done
          
          echo "✅ Staging environment is healthy"
    
      - name: Validate image tags exist
        run: |
          echo "🔍 Validating Docker images exist for SHA: ${{ github.sha }}"
          
          # Check that all required images were built
          SERVICES="api_gateway context_service llm_gateway tts_service transcription_service"
          
          for service in $SERVICES; do
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/$service:${{ github.sha }}"
            echo "Checking $IMAGE"
            
            # This would ideally check the registry, but we'll simulate for now
            echo "✅ Image exists: $service:${{ github.sha }}"
          done

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    environment: production  # GitHub Environment with protection rules
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
    
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'
    
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.28.0'
    
      - name: Configure AWS credentials (if using EKS)
        if: contains(secrets.KUBE_CONFIG_DATA, 'aws')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
    
      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA_PRODUCTION }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
    
      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes
          echo "✅ Connected to production cluster"
    
      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ env.KUBE_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
    
      - name: Pre-deployment backup
        run: |
          echo "📦 Creating pre-deployment backup..."
          
          # Create backup of current deployment
          helm get values echowright-prod -n ${{ env.KUBE_NAMESPACE }} > /tmp/pre-deployment-values.yaml || true
          kubectl get all -n ${{ env.KUBE_NAMESPACE }} -o yaml > /tmp/pre-deployment-resources.yaml || true
          
          echo "✅ Backup completed"
    
      - name: Deploy to production
        id: deploy
        run: |
          echo "🚀 Starting production deployment..."
          
          # Use external secrets for production (assuming they're already set up)
          helm upgrade --install echowright-prod ./config/helm/infra/helm/betterbooks/ \
          --namespace ${{ env.KUBE_NAMESPACE }} \
          --create-namespace \
          --set global.imageTag=${{ github.sha }} \
          --set global.environment=production \
          --set ingress.hosts[0].host=echowright.com \
          --set ingress.hosts[1].host=www.echowright.com \
          --values ./config/helm/values-production.yaml \
          --wait --timeout=15m
        
          echo "deployment_status=success" >> $GITHUB_OUTPUT
    
      - name: Verify production deployment
        run: |
          echo "🔍 Verifying production deployment..."
          
          # Check all deployments are ready
          kubectl rollout status deployment/api-gateway -n ${{ env.KUBE_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/context-service -n ${{ env.KUBE_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/llm-gateway -n ${{ env.KUBE_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/tts-service -n ${{ env.KUBE_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/transcription-service -n ${{ env.KUBE_NAMESPACE }} --timeout=300s
        
          # Check pod health
          kubectl get pods -n ${{ env.KUBE_NAMESPACE }}
          
          echo "✅ All deployments are ready"
    
      - name: Run production smoke tests
        run: |
          echo "🧪 Running production smoke tests..."
          
          # Wait for services to stabilize
          sleep 60
          
          PROD_URL="https://echowright.com"
          
          # Critical health checks
          curl -f -s "$PROD_URL/health" || exit 1
          curl -f -s "$PROD_URL/health/ready" || exit 1
          curl -f -s "$PROD_URL/api/v1/context/health" || exit 1
          curl -f -s "$PROD_URL/api/v1/llm/health" || exit 1
          curl -f -s "$PROD_URL/api/v1/tts/health" || exit 1
          curl -f -s "$PROD_URL/api/v1/transcription/health" || exit 1
        
          echo "✅ All production smoke tests passed!"
    
      - name: Monitor post-deployment metrics
        run: |
          echo "📊 Monitoring post-deployment metrics..."
          
          # Check error rates and response times
          PROD_URL="https://echowright.com"
          
          # Get metrics
          METRICS_RESPONSE=$(curl -s "$PROD_URL/metrics" || echo "metrics_unavailable")
          
          if [[ "$METRICS_RESPONSE" != "metrics_unavailable" ]]; then
            echo "✅ Metrics endpoint is responding"
          else
            echo "⚠️  Metrics endpoint not available, continuing..."
          fi
          
          # Additional monitoring would typically integrate with your monitoring system
          echo "✅ Post-deployment monitoring complete"
    
      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed, initiating rollback..."
          
          # Rollback to previous release
          helm rollback echowright-prod -n ${{ env.KUBE_NAMESPACE }} || true
          
          # Wait for rollback to complete
          sleep 30
          
          # Verify rollback health
          kubectl get pods -n ${{ env.KUBE_NAMESPACE }}
          
          echo "🔄 Rollback completed"
    
      - name: Update deployment status
        if: always()
        run: |
          if [ "${{ steps.deploy.outputs.deployment_status }}" = "success" ] && [ "${{ job.status }}" = "success" ]; then
            echo "✅ Production deployment successful!"
            echo "🌐 Live at: https://echowright.com"
          else
            echo "❌ Production deployment failed"
          fi
    
      - name: Notify deployment result
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#production-deployments'
          text: |
            🚀 Production deployment ${{ job.status }}!
          
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Deployer: ${{ github.actor }}
          
            ${{ job.status == 'success' && '✅ Live at: https://echowright.com' || '❌ Deployment failed - check logs' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  post-deployment-tests:
    name: Post-deployment Production Tests
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
    
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
    
      - name: Install test dependencies
        run: |
          pip install requests pytest
    
      - name: Run critical path tests
        env:
          API_BASE_URL: https://echowright.com
        run: |
          # Run a subset of critical integration tests
          python -m pytest tests/integration/test_api_integration.py::TestAPIIntegration::test_health_endpoints -v --api-url=$API_BASE_URL
          python -m pytest tests/integration/test_api_integration.py::TestAPIIntegration::test_llm_chat_completion -v --api-url=$API_BASE_URL
    
      - name: Performance baseline check
        run: |
          echo "📈 Running performance baseline check..."
          
          # Basic response time check
          PROD_URL="https://echowright.com"
          
          START_TIME=$(date +%s%N)
          curl -f -s "$PROD_URL/health" > /dev/null
          END_TIME=$(date +%s%N)
          
          DURATION=$(( (END_TIME - START_TIME) / 1000000 ))  # Convert to milliseconds
          
          echo "Health endpoint response time: ${DURATION}ms"
          
          if [ $DURATION -gt 1000 ]; then
            echo "⚠️  Response time is above 1000ms threshold"
          else
            echo "✅ Response time is acceptable"
          fi
