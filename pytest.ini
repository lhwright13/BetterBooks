[pytest]
# BetterBooks Test Configuration

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async test support
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests (run without external dependencies)
    integration: Integration tests (require database/services)
    slow: Slow tests (skip with -m "not slow")
    asyncio: Async tests

# Output configuration
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Minimum version
minversion = 7.0

# Console output
console_output_style = progress

# Logging during tests
log_cli = false
log_cli_level = WARNING
