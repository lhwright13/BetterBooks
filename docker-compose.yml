# Local development only. The POSTGRES_PASSWORD, JWT_SECRET_KEY, and
# Grafana admin credentials below are placeholders for running on localhost;
# override every one of them (via .env or real secret management) before
# pointing this file at anything public.

networks:
  betterbooks_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  loki_data:
  prometheus_data:

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-betterbooks}
      POSTGRES_USER: ${POSTGRES_USER:-betterbooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betterbooks}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./core/database/migrations:/docker-entrypoint-initdb.d/migrations:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-betterbooks}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - betterbooks_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - betterbooks_network

  api_gateway:
    build:
      context: .
      dockerfile: platform/backend/services/api_gateway/Dockerfile
    env_file:
      - .env
    environment:
      LLM_GATEWAY_URL: http://llm_gateway:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-betterbooks}:${POSTGRES_PASSWORD:-betterbooks}@postgres:5432/${POSTGRES_DB:-betterbooks}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key}
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./platform/backend/services/api_gateway:/app
      - ./core:/app/core
      - ./book_files:/app/book_files:ro
      - ./config/personas:/app/config/personas:ro
    networks:
      - betterbooks_network
    profiles:
      - full

  llm_gateway:
    build:
      context: .
      dockerfile: platform/backend/services/llm_gateway/Dockerfile
    env_file:
      - .env
    environment:
      USE_OLLAMA: ${USE_OLLAMA:-true}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:latest}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-}
      REDIS_URL: redis://redis:6379/1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8002:8000"
    volumes:
      - ./platform/backend/services/llm_gateway:/app
      - ./core:/app/core
    networks:
      - betterbooks_network
    profiles:
      - full

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4327:4317"
      - "4328:4318"
      - "8888:8888"
      - "8889:8889"
    depends_on:
      - jaeger
      - loki
    networks:
      - betterbooks_network
    profiles:
      - observability

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14250:14250"
      - "4317:4317"
      - "4318:4318"
    networks:
      - betterbooks_network
    profiles:
      - observability

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./config/observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - betterbooks_network
    profiles:
      - observability

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    networks:
      - betterbooks_network
    profiles:
      - observability

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./config/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - betterbooks_network
    profiles:
      - observability

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - jaeger
    networks:
      - betterbooks_network
    profiles:
      - observability
