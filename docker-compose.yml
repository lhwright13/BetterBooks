# Docker Compose configuration for EchoWright audiobook companion platform
#
# This file defines the complete microservices architecture for local development
# of the EchoWright audiobook companion app. It orchestrates all backend services,
# databases, and the web demo application in a unified development environment.
#
# Architecture Overview:
# - API Gateway (port 8000): Central entry point for client applications
# - Context Service (port 8001): Vector embeddings and similarity search
# - LLM Gateway (port 8002): AI persona management and text completion
# - TTS Service (port 8004): Text-to-speech synthesis
# - Transcription Service (port 8003): Audio transcription and context extraction
# - PostgreSQL + pgvector: Vector database for embeddings storage
# - Web App (port 8080): HTML/JS demo interface
#
# Key Features:
# - Complete service mesh with proper networking
# - Persistent data storage for PostgreSQL and transcription cache
# - Volume mounts for book files and configuration sharing
# - Environment variable configuration for API keys
# - Service dependencies and health check orchestration
#
# Usage:
# 1. Set GEMINI_API_KEY environment variable
# 2. Run: docker-compose up --build
# 3. Access web demo at http://localhost:8080
# 4. API Gateway available at http://localhost:8000
#
# Development Notes:
# - Book files stored in ./book_files/ (mounted to services)
# - LLM persona configs in ./llm_configs/ (mounted to LLM services)
# - PostgreSQL data persisted in named volume
# - All services use internal Docker networking for communication

version: "3.9"
services:
  postgres:
    # pgvector-enabled Postgres image
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: betterbooks
      POSTGRES_PASSWORD: betterbooks
      POSTGRES_DB: betterbooks
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api_gateway:
    build: ./services/api_gateway
    environment:
      CONTEXT_SERVICE_URL: http://context_service:8000
      LLM_GATEWAY_URL: http://llm_gateway:8000
      TTS_SERVICE_URL: http://tts_service:8000
      TRANSCRIPTION_SERVICE_URL: http://transcription_service:8003
    depends_on:
      - context_service
      - llm_gateway
      - tts_service
      - transcription_service
    ports:
      - "8000:8000"
    volumes:
      - ./book_files:/app/book_files

  context_service:
    build: ./services/context_service
    environment:
      DATABASE_URL: postgres://betterbooks:betterbooks@postgres:5432/betterbooks
    depends_on:
      - postgres
    ports:
      - "8001:8000"

  llm_gateway:
    build: ./services/llm_gateway
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8002:8000"
    volumes:
      - ./llm_configs:/app/llm_configs

  tts_service:
    build: ./services/tts_service
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8004:8000"
    volumes:
      - ./llm_configs:/app/llm_configs

  transcription_service:
    build: ./services/transcription_service
    ports:
      - "8003:8003"
    volumes:
      - ./book_files:/app/book_files
      - ./context_config.yaml:/context_config.yaml
      - transcription_cache:/app/transcript_cache

  web_app:
    build: ./web_app
    depends_on:
      - api_gateway
    ports:
      - "8080:80"

volumes:
  postgres_data:
  transcription_cache:
