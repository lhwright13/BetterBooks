version: '3.8'

# EchoWright Audiobook Platform - Development Environment
# Orchestrates all backend services, databases, and frontend applications
# for local development of the AI-powered audiobook companion platform.

networks:
  betterbooks_network:
    driver: bridge

volumes:
  postgres_data:
  pgbouncer_logs:
  redis_data:
  transcription_cache:

services:
  # === DATABASE LAYER ===
  
  postgres_primary:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-betterbooks}
      POSTGRES_USER: ${POSTGRES_USER:-betterbooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betterbooks}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/local/postgresql_primary.conf:/etc/postgresql/postgresql.conf:ro
      - ./init_primary.sql:/docker-entrypoint-initdb.d/init_primary.sql:ro
      - ./core/database/migrations:/migrations:ro
    ports:
      - "5432:5432"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-betterbooks}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - betterbooks_network

  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    environment:
      DATABASES_HOST: postgres_primary
      DATABASES_PORT: 5432
      DATABASES_USER: ${POSTGRES_USER:-betterbooks}
      DATABASES_PASSWORD: ${POSTGRES_PASSWORD:-betterbooks}
      DATABASES_DBNAME: ${POSTGRES_DB:-betterbooks}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
    volumes:
      - ./config/local/pgbouncer_primary.ini:/etc/pgbouncer/pgbouncer.ini
      - pgbouncer_logs:/var/log/pgbouncer
    ports:
      - "6432:6432"
    depends_on:
      postgres_primary:
        condition: service_healthy
    networks:
      - betterbooks_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - betterbooks_network

  # === BACKEND SERVICES ===

  context_service:
    build:
      context: ./platform/backend/services
      dockerfile: context_service/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-betterbooks}:${POSTGRES_PASSWORD:-betterbooks}@pgbouncer:6432/${POSTGRES_DB:-betterbooks}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ./core:/app/core:ro
    networks:
      - betterbooks_network

  llm_gateway:
    build:
      context: ./platform/backend/services
      dockerfile: llm_gateway/Dockerfile
    env_file:
      - .env
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      REDIS_URL: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8002:8000"
    volumes:
      - ./config/production/llm_configs:/app/llm_configs:ro
      - ./core:/app/core:ro
    networks:
      - betterbooks_network

  transcription_service:
    build:
      context: ./platform/backend/services
      dockerfile: transcription_service/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-betterbooks}:${POSTGRES_PASSWORD:-betterbooks}@pgbouncer:6432/${POSTGRES_DB:-betterbooks}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      pgbouncer:
        condition: service_started
    ports:
      - "8003:8000"
    volumes:
      - ./book_files:/app/book_files:ro
      - ./config/local/context_config.yaml:/context_config.yaml:ro
      - transcription_cache:/app/transcript_cache
      - ./core:/app/core:ro
    networks:
      - betterbooks_network

  tts_service:
    build:
      context: ./platform/backend/services
      dockerfile: tts_service/Dockerfile
    env_file:
      - .env
    ports:
      - "8004:8000"
    volumes:
      - ./core:/app/core:ro
    networks:
      - betterbooks_network

  api_gateway:
    build:
      context: ./platform/backend/services
      dockerfile: api_gateway/Dockerfile
    env_file:
      - .env
    environment:
      CONTEXT_SERVICE_URL: http://context_service:8000
      LLM_GATEWAY_URL: http://llm_gateway:8000
      TTS_SERVICE_URL: http://tts_service:8000
      TRANSCRIPTION_SERVICE_URL: http://transcription_service:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-betterbooks}:${POSTGRES_PASSWORD:-betterbooks}@pgbouncer:6432/${POSTGRES_DB:-betterbooks}
      REDIS_URL: redis://redis:6379/2
    depends_on:
      - context_service
      - llm_gateway
      - tts_service
      - transcription_service
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./core:/app/core:ro
    networks:
      - betterbooks_network

  # === FRONTEND APPLICATIONS ===

  web_app:
    build:
      context: ./platform/frontend/web_app
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api_gateway
    networks:
      - betterbooks_network