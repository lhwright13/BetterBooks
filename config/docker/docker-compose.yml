# Docker Compose configuration for EchoWright audiobook companion platform
#
# This file defines the complete microservices architecture for local development
# of the EchoWright audiobook companion app. It orchestrates all backend services,
# databases, and the web demo application in a unified development environment.
#
# Architecture Overview:
# - API Gateway (port 8000): Central entry point for client applications
# - Context Service (port 8001): Vector embeddings and similarity search
# - LLM Gateway (port 8002): AI persona management and text completion
# - TTS Service (port 8004): Text-to-speech synthesis  
# - Transcription Service (port 8003): Audio transcription and context extraction
# - PostgreSQL + pgvector: Vector database for embeddings storage
# - Web App (port 8080): HTML/JS demo interface
#
# Key Features:
# - Complete service mesh with proper networking
# - Persistent data storage for PostgreSQL and transcription cache
# - Volume mounts for book files and configuration sharing
# - Environment variable configuration for API keys
# - Service dependencies and health check orchestration
#
# Usage:
# 1. Set GEMINI_API_KEY environment variable
# 2. Run: docker-compose up --build
# 3. Access web demo at http://localhost:8080
# 4. API Gateway available at http://localhost:8000
#
# Development Notes:
# - Book files stored in ./book_files/ (mounted to services)
# - LLM persona configs in ./llm_configs/ (mounted to LLM services)
# - PostgreSQL data persisted in named volume
# - All services use internal Docker networking for communication

version: "3.9"
services:
  # PostgreSQL Primary (Master) Database
  postgres_primary:
    # pgvector-enabled Postgres image
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-betterbooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betterbooks}
      POSTGRES_DB: ${POSTGRES_DB:-betterbooks}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator_pass}
      # PostgreSQL performance tuning
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./postgresql_primary.conf:/etc/postgresql/postgresql.conf
      - ./init_primary.sql:/docker-entrypoint-initdb.d/init_primary.sql
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    networks:
      - betterbooks_network

  # PostgreSQL Read Replica
  postgres_replica:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-betterbooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betterbooks}
      POSTGRES_DB: ${POSTGRES_DB:-betterbooks}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator_pass}
      POSTGRES_PRIMARY_HOST: postgres_primary
      POSTGRES_PRIMARY_PORT: 5432
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./postgresql_replica.conf:/etc/postgresql/postgresql.conf
      - ./init_replica.sh:/docker-entrypoint-initdb.d/init_replica.sh
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5433:5432"
    depends_on:
      - postgres_primary
    networks:
      - betterbooks_network

  # PgBouncer - Connection Pooling
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    restart: unless-stopped
    environment:
      DATABASES_HOST: postgres_primary
      DATABASES_PORT: 5432
      DATABASES_USER: ${POSTGRES_USER:-betterbooks}
      DATABASES_PASSWORD: ${POSTGRES_PASSWORD:-betterbooks}
      DATABASES_DBNAME: ${POSTGRES_DB:-betterbooks}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 300
      DEFAULT_POOL_SIZE: 25
      SERVER_RESET_QUERY: DISCARD ALL
    volumes:
      - ./pgbouncer_primary.ini:/etc/pgbouncer/pgbouncer.ini
      - ./config/database/userlist.txt:/etc/pgbouncer/userlist.txt
    ports:
      - "6432:6432"
    depends_on:
      - postgres_primary
      - postgres_replica
    networks:
      - betterbooks_network

  # PgBouncer for Read Replica - Read-Only Queries
  pgbouncer_replica:
    image: pgbouncer/pgbouncer:latest
    restart: unless-stopped
    environment:
      DATABASES_HOST: postgres_replica
      DATABASES_PORT: 5432
      DATABASES_USER: ${POSTGRES_USER:-betterbooks}
      DATABASES_PASSWORD: ${POSTGRES_PASSWORD:-betterbooks}
      DATABASES_DBNAME: ${POSTGRES_DB:-betterbooks}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 15
      SERVER_RESET_QUERY: DISCARD ALL
    volumes:
      - ./pgbouncer_replica.ini:/etc/pgbouncer/pgbouncer.ini
      - ./config/database/userlist.txt:/etc/pgbouncer/userlist.txt
    ports:
      - "6433:6432"
    depends_on:
      - postgres_replica
    networks:
      - betterbooks_network

  api_gateway:
    build:
      context: ./services
      dockerfile: api_gateway/Dockerfile
    env_file:
      - .env
    environment:
      CONTEXT_SERVICE_URL: http://context_service:8000
      LLM_GATEWAY_URL: http://llm_gateway:8000
      TTS_SERVICE_URL: http://tts_service:8000
      TRANSCRIPTION_SERVICE_URL: http://transcription_service:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-betterbooks}:${POSTGRES_PASSWORD:-betterbooks}@pgbouncer:6432/${POSTGRES_DB:-betterbooks}
    depends_on:
      - context_service
      - llm_gateway
      - tts_service
      - transcription_service
    ports:
      - "8000:8000"
    volumes:
      - ./book_files:/app/book_files
    networks:
      - betterbooks_network

  context_service:
    build: ./services/context_service
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-betterbooks}:${POSTGRES_PASSWORD:-betterbooks}@pgbouncer:6432/${POSTGRES_DB:-betterbooks}
    depends_on:
      - postgres_primary
      - pgbouncer
    ports:
      - "8001:8000"
    networks:
      - betterbooks_network

  llm_gateway:
    build: ./services/llm_gateway
    env_file:
      - .env
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "8002:8000"
    volumes:
      - ./llm_configs:/app/llm_configs
    networks:
      - betterbooks_network

  tts_service:
    build: ./services/tts_service
    env_file:
      - .env
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    ports:
      - "8004:8000"
    volumes:
      - ./llm_configs:/app/llm_configs
    networks:
      - betterbooks_network

  transcription_service:
    build:
      context: ./services
      dockerfile: transcription_service/Dockerfile
    env_file:
      - .env
    environment:
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8003:8000"
    volumes:
      - ./book_files:/app/book_files
      - ./context_config.yaml:/context_config.yaml
      - transcription_cache:/app/transcript_cache
    networks:
      - betterbooks_network

  web_app:
    build: ./web_app
    env_file:
      - .env
    depends_on:
      - api_gateway
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    networks:
      - betterbooks_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - betterbooks_network

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - api_gateway
      - llm_gateway
      - context_service
      - tts_service
    networks:
      - betterbooks_network

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - betterbooks_network

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger HTTP collector
      - "6831:6831/udp"  # Jaeger agent UDP
      - "6832:6832/udp"  # Jaeger agent UDP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=info
    volumes:
      - jaeger_data:/tmp
    networks:
      - betterbooks_network

volumes:
  postgres_primary_data:
  postgres_replica_data:
  transcription_cache:
  redis_data:
  prometheus_data:
  grafana_data:
  jaeger_data:

networks:
  betterbooks_network:
    driver: bridge
