# PostgreSQL Primary (Master) Configuration for EchoWright
# Optimized for replication and high availability

# PostgreSQL Primary Configuration
# Base configuration is already provided by the image

# Replication Settings
wal_level = replica                     # Enable replication
max_wal_senders = 10                   # Maximum number of WAL sender processes
max_replication_slots = 10             # Maximum number of replication slots
wal_keep_size = 2GB                    # Amount of WAL to keep for standby

# Streaming Replication
hot_standby = on                       # Enable hot standby
hot_standby_feedback = on              # Enable feedback from standby

# Archive Settings (disabled for development)
archive_mode = off                     # Disable archiving for development
# archive_command = 'test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f'
# archive_timeout = 300s               # Archive timeout (5 minutes)

# Connection Settings for Replication
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 5

# Performance Settings
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 128MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100

# Logging for Replication Monitoring
log_replication_commands = on
log_min_duration_statement = 1000
log_line_prefix = 'PRIMARY %m [%p] %q%u@%d '

# Autovacuum (important for high-write workloads)
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# Background Writer
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100