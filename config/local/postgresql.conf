# PostgreSQL Configuration for EchoWright Production
# Optimized for vector embeddings, concurrent connections, and performance

# Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 200                   # Reduced since pgbouncer handles pooling
superuser_reserved_connections = 3

# Memory Settings
shared_buffers = 256MB                  # 25% of RAM (adjust for your server)
effective_cache_size = 1GB             # 75% of RAM (adjust for your server)
work_mem = 8MB                          # Per-operation memory
maintenance_work_mem = 128MB            # For maintenance operations

# Write Ahead Logging (WAL)
wal_level = replica                     # Enable replication
wal_buffers = 16MB
checkpoint_completion_target = 0.8
checkpoint_timeout = 10min
max_wal_size = 2GB
min_wal_size = 512MB

# Query Planner
random_page_cost = 1.1                  # SSD storage
effective_io_concurrency = 200         # SSD concurrent requests
seq_page_cost = 1.0

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0600
log_rotation_age = 1d
log_rotation_size = 100MB
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# What to log
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_error_verbosity = default
log_min_duration_statement = 1000      # Log slow queries (1 second)
log_statement = 'none'

# Autovacuum Settings (important for embeddings table)
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 20s               # Check for work more frequently
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.05  # More aggressive vacuuming
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05

# Background Writer
bgwriter_delay = 100ms
bgwriter_lru_maxpages = 200
bgwriter_lru_multiplier = 4.0

# Asynchronous I/O
synchronous_commit = on
wal_sync_method = fsync

# Parallel Processing
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 2

# Lock Management
max_locks_per_transaction = 128
max_pred_locks_per_transaction = 128

# Cost-based Vacuum Delay (prevent vacuum from overwhelming system)
vacuum_cost_delay = 10ms
vacuum_cost_page_hit = 1
vacuum_cost_page_miss = 10
vacuum_cost_page_dirty = 20
vacuum_cost_limit = 2000

# Statistics Collection
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

# Extension-specific settings for pgvector
shared_preload_libraries = 'pg_stat_statements'

# Timezone
timezone = 'UTC'
log_timezone = 'UTC'

# SSL Configuration (disable for local development)
ssl = off

# Locale Settings  
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# Client Connection Defaults
default_transaction_isolation = 'read committed'
default_transaction_read_only = off
default_transaction_deferrable = off
statement_timeout = 30000              # 30 second timeout
lock_timeout = 10000                   # 10 second lock timeout
idle_in_transaction_session_timeout = 300000  # 5 minute idle timeout

# Error Handling
restart_after_crash = on
exit_on_error = off

# Resource Usage Logging
log_executor_stats = off
log_parser_stats = off
log_planner_stats = off
log_statement_stats = off

# Development vs Production Settings
# For production, consider:
# - Increasing shared_buffers based on available RAM
# - Adjusting effective_cache_size based on system memory
# - Tuning checkpoint settings for your workload
# - Setting up connection pooling limits based on expected load