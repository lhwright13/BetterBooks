apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        # Azure Container Registry (ACR) image
        # Replace <registry-name> with your ACR name
        image: betterbooks.azurecr.io/api_gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: CONTEXT_SERVICE_URL
          value: http://context-service:80
        - name: LLM_GATEWAY_URL  
          value: http://llm-gateway:80
        - name: TTS_SERVICE_URL
          value: http://tts-service:80
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
  selector:
    app: api-gateway