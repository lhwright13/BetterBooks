apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: betterbooks-ingress
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: betterbooks-ip
spec:
  rules:
  - host: api.betterbooks.app
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80