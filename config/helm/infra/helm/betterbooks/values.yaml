# EchoWright Audiobook Platform - Helm Values

global:
  # Container registry configuration
  registry: "ghcr.io"
  imageRepository: "echowright/betterbooks"
  imageTag: "latest"
  
  # Environment
  environment: production
  namespace: betterbooks
  
# Database configuration
postgres:
  host: "postgres"
  port: 5432
  database: "betterbooks"

# Redis configuration  
redis:
  host: "redis"
  port: 6379

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: echowright.com
      paths:
        - path: /
          pathType: Prefix
    - host: www.echowright.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: echowright-tls
      hosts:
        - echowright.com
        - www.echowright.com

# Secrets configuration (for non-production environments)
secrets:
  create: false  # In production, create secrets manually via CI/CD
  postgresUser: ""
  postgresPassword: ""
  redisPassword: ""
  jwtSecret: ""
  geminiApiKey: ""

# Service configurations
apiGateway:
  replicas: 2
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"  
      cpu: "500m"

contextService:
  replicas: 2
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

llmGateway:
  replicas: 2
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

ttsService:
  replicas: 1
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1"

transcriptionService:
  replicas: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"