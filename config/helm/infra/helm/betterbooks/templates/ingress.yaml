{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echowright-ingress
  namespace: {{ .Values.global.namespace | default "betterbooks" }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: api-gateway
              port:
                number: 8000
        - path: /api/v1/context
          pathType: Prefix
          backend:
            service:
              name: context-service
              port:
                number: 8001
        - path: /api/v1/llm
          pathType: Prefix
          backend:
            service:
              name: llm-gateway
              port:
                number: 8002
        - path: /api/v1/tts
          pathType: Prefix
          backend:
            service:
              name: tts-service
              port:
                number: 8003
        - path: /api/v1/transcription
          pathType: Prefix
          backend:
            service:
              name: transcription-service
              port:
                number: 8004
    {{- end }}
{{- end }}