{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: {{ .Values.global.namespace | default "betterbooks" }}
type: Opaque
data:
  postgres-user: {{ .Values.secrets.postgresUser | b64enc }}
  postgres-password: {{ .Values.secrets.postgresPassword | b64enc }}
  redis-password: {{ .Values.secrets.redisPassword | b64enc }}
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc }}
  gemini-api-key: {{ .Values.secrets.geminiApiKey | b64enc }}
{{- end }}