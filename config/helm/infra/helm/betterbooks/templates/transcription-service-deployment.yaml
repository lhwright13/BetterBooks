apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcription-service
  namespace: {{ .Values.global.namespace | default "betterbooks" }}
  labels:
    app: transcription-service
    version: {{ .Values.global.imageTag | default "latest" }}
spec:
  replicas: {{ .Values.transcriptionService.replicas | default 1 }}
  selector:
    matchLabels:
      app: transcription-service
  template:
    metadata:
      labels:
        app: transcription-service
        version: {{ .Values.global.imageTag | default "latest" }}
    spec:
      containers:
      - name: transcription-service
        image: {{ .Values.global.registry }}/{{ .Values.global.imageRepository }}/transcription_service:{{ .Values.global.imageTag | default "latest" }}
        ports:
        - containerPort: 8004
          name: http
        env:
        - name: ENVIRONMENT
          value: {{ .Values.global.environment | default "production" }}
        - name: REDIS_HOST
          value: {{ .Values.redis.host | default "redis" }}
        - name: REDIS_PORT
          value: {{ .Values.redis.port | default "6379" | quote }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: {{ .Values.transcriptionService.resources.requests.memory | default "512Mi" }}
            cpu: {{ .Values.transcriptionService.resources.requests.cpu | default "250m" }}
          limits:
            memory: {{ .Values.transcriptionService.resources.limits.memory | default "1Gi" }}
            cpu: {{ .Values.transcriptionService.resources.limits.cpu | default "500m" }}