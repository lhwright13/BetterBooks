# Grafana configuration for EchoWright monitoring
image:
  repository: grafana/grafana
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: LoadBalancer
  port: 3000
  targetPort: 3000

# Resource limits and requests
resources:
  limits:
    cpu: "500m"
    memory: "1Gi"
  requests:
    cpu: "200m"
    memory: "512Mi"

# Persistent storage for dashboards and data
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce

# Admin credentials
admin:
  existingSecret: ""
  username: admin
  password: echowright2025

# Grafana configuration
config:
  server:
    root_url: "http://localhost:3000"
    domain: "localhost"
  security:
    admin_user: admin
    admin_password: echowright2025
    allow_embedding: true
    cookie_secure: false
  auth:
    anonymous:
      enabled: false
  dashboards:
    default_home_dashboard_path: "/var/lib/grafana/dashboards/echowright-overview.json"

# Datasources configuration
datasources:
  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: true

# Dashboard providers
dashboardProviders:
  - name: default
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards

# Security context
securityContext:
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472

# Environment variables
env:
  - name: GF_SECURITY_ADMIN_USER
    value: "admin"
  - name: GF_SECURITY_ADMIN_PASSWORD
    value: "echowright2025"
  - name: GF_USERS_ALLOW_SIGN_UP
    value: "false"
  - name: GF_SERVER_ROOT_URL
    value: "http://localhost:3000"

# Node selector for deployment
nodeSelector: {}

# Tolerations for deployment
tolerations: []

# Affinity rules
affinity: {}