# Prometheus configuration for EchoWright monitoring
image:
  repository: prom/prometheus
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: LoadBalancer
  port: 9090
  targetPort: 9090

# Resource limits and requests (minimal for constrained cluster)
resources:
  limits:
    cpu: "100m"
    memory: "256Mi"
  requests:
    cpu: "50m"
    memory: "128Mi"

# Persistent storage for metrics data (disabled for testing due to resource constraints)
persistence:
  enabled: false
  size: 5Gi
  storageClass: ""
  accessMode: ReadWriteOnce

# Data retention configuration
config:
  retention: "30d"
  retentionSize: "15GB"
  scrapeInterval: "15s"
  evaluationInterval: "15s"

# Security settings
securityContext:
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

# Service monitor configuration
serviceMonitor:
  enabled: true
  endpoints:
    - api_gateway:
        port: 8000
        path: "/metrics"
        interval: "15s"
    - llm_gateway:
        port: 8002
        path: "/metrics"
        interval: "15s"
    - context_service:
        port: 8001
        path: "/metrics"
        interval: "15s"
    - tts_service:
        port: 8003
        path: "/metrics"
        interval: "15s"

# Alerting configuration
alerting:
  enabled: false
  alertmanagerUrl: ""

# Node selector for deployment
nodeSelector: {}

# Tolerations for deployment
tolerations: []

# Affinity rules
affinity: {}