apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-gateway.fullname" . }}
  labels:
    app: {{ include "api-gateway.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "api-gateway.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "api-gateway.name" . }}
    spec:
      imagePullSecrets:
      - name: acr-secret
      containers:
        - name: api-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8000
          env:
            - name: CONTEXT_SERVICE_URL
              value: http://context-service:8001
            - name: LLM_GATEWAY_URL
              value: http://llm-gateway:8002
            - name: TTS_SERVICE_URL
              value: http://tts-service:8003
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: gemini-api-key
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret-key
            # Email Service Configuration
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: sendgrid-api-key
            - name: AWS_SES_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: aws-ses-access-key-id
            - name: AWS_SES_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: aws-ses-secret-access-key
            - name: AWS_SES_REGION
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: aws-ses-region
            - name: EMAIL_FROM_ADDRESS
              value: "noreply@echowright.com"
            - name: EMAIL_FROM_NAME
              value: "EchoWright"
            - name: FRONTEND_BASE_URL
              value: "https://app.echowright.com"
            # OAuth Configuration
            - name: GOOGLE_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: google-oauth-client-id
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: google-oauth-client-secret
            - name: APPLE_OAUTH_TEAM_ID
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: apple-oauth-team-id
            - name: APPLE_OAUTH_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: apple-oauth-key-id
            # Azure Storage Configuration
            - name: AZURE_STORAGE_ACCOUNT_NAME
              valueFrom:
                secretKeyRef:
                  name: azure-storage-secrets
                  key: AZURE_STORAGE_ACCOUNT_NAME
            - name: AZURE_STORAGE_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: azure-storage-secrets
                  key: AZURE_STORAGE_ACCOUNT_KEY
            # Database Configuration
            - name: DATABASE_URL
              value: postgresql://betterbooks:betterbooks@postgres:5432/betterbooks
            # Azure OpenAI Configuration
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: azure-openai-api-key
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: azure-openai-endpoint
            - name: AZURE_OPENAI_DEPLOYMENT_NAME
              value: gpt-4o-mini
