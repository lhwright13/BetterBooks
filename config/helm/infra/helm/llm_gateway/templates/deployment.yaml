apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-gateway.fullname" . }}
  labels:
    app: {{ include "llm-gateway.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "llm-gateway.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "llm-gateway.name" . }}
    spec:
      containers:
        - name: llm-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8000
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: gemini-api-key
          volumeMounts:
            - name: llm-configs
              mountPath: /app/llm_configs
              readOnly: true
      volumes:
        - name: llm-configs
          configMap:
            name: llm-configs
