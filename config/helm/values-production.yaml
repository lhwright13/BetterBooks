# Helm values for production environment
# Production-ready configuration with high availability and performance

global:
  environment: production
  registry: registry.gitlab.com/your-group/echowright
  imageTag: stable
  pullPolicy: IfNotPresent

# Production resource allocations
resources:
  api_gateway:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  
  context_service:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  
  llm_gateway:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  
  tts_service:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  
  transcription_service:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# High availability replica counts
replicaCount:
  api_gateway: 3
  context_service: 2
  llm_gateway: 3
  tts_service: 2
  transcription_service: 2

# Production database configuration
database:
  host: postgres-prod.internal
  port: 5432
  name: echowright_prod
  user: echowright_prod
  # Password managed via external secrets
  ssl_mode: require
  max_connections: 100
  connection_pool_size: 20

# Production Redis configuration
redis:
  host: redis-prod.internal
  port: 6379
  # Password managed via external secrets
  cluster_enabled: true
  max_connections: 50

# Production ingress with SSL termination
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://echowright.com,https://www.echowright.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: echowright.com
      paths:
        - path: /
          pathType: Prefix
    - host: www.echowright.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: production-tls
      hosts:
        - echowright.com
        - www.echowright.com

# Service configuration
service:
  type: ClusterIP
  api_gateway:
    port: 8000
  context_service:
    port: 8001
  llm_gateway:
    port: 8002
  tts_service:
    port: 8003
  transcription_service:
    port: 8004

# Production environment variables
env:
  # Logging
  LOG_LEVEL: WARNING  # Less verbose in production
  
  # Features
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
  ENABLE_PROFILING: "false"  # Disabled in production
  
  # External APIs (production keys managed via secrets)
  # GEMINI_API_KEY set via external secret
  
  # Performance tuning
  WORKER_CONNECTIONS: "2000"
  MAX_CONCURRENT_REQUESTS: "500"
  KEEP_ALIVE_TIMEOUT: "65"
  
  # Security
  JWT_ALGORITHM: "RS256"  # More secure algorithm
  CORS_ORIGINS: "https://echowright.com,https://www.echowright.com"
  SECURE_COOKIES: "true"
  
  # Caching
  CACHE_TTL: "1800"  # 30 minutes
  ENABLE_CACHING: "true"
  CACHE_MAX_SIZE: "1000000"
  
  # Rate limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "1000"
  RATE_LIMIT_WINDOW: "3600"  # 1 hour

# Production monitoring and observability
monitoring:
  prometheus:
    enabled: true
    port: 9090
    retention: "30d"
  
  jaeger:
    enabled: true
    endpoint: http://jaeger-collector.monitoring:14268/api/traces
    sampling_rate: 0.1  # 10% sampling in production
  
  grafana:
    enabled: true
    port: 3000
    persistence: true

# Comprehensive health checks
healthChecks:
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

# Production autoscaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70
  scaleUpPeriodSeconds: 60
  scaleDownPeriodSeconds: 300

# Persistent storage for production
persistence:
  enabled: true
  size: 100Gi
  storageClass: gp3
  accessMode: ReadWriteOnce

# Production security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Strict network policies
networkPolicy:
  enabled: true
  allowExternal: false
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
    - from:
      - namespaceSelector:
          matchLabels:
            name: monitoring

# Pod disruption budget for high availability
podDisruptionBudget:
  enabled: true
  minAvailable: 50%

# Production node affinity
nodeAffinity:
  requiredDuringSchedulingIgnoredDuringExecution:
    nodeSelectorTerms:
    - matchExpressions:
      - key: environment
        operator: In
        values:
        - production
      - key: node-type
        operator: In
        values:
        - compute-optimized

# Anti-affinity for service distribution
podAntiAffinity:
  preferredDuringSchedulingIgnoredDuringExecution:
  - weight: 100
    podAffinityTerm:
      labelSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - echowright
      topologyKey: kubernetes.io/hostname

# Production tolerations
tolerations:
  - key: environment
    operator: Equal
    value: production
    effect: NoSchedule

# Backup configuration
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: "30d"
  storage:
    class: gp3
    size: 50Gi

# Secrets management
secrets:
  enabled: true
  external: true  # Use external secret management
  provider: vault  # HashiCorp Vault or AWS Secrets Manager

# Compliance and auditing
compliance:
  enabled: true
  auditLogs: true
  dataRetention: "2y"
  encryption:
    atRest: true
    inTransit: true