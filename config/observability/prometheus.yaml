# Prometheus Configuration - Metrics Collection

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OpenTelemetry Collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # API Gateway metrics (if exposed)
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api_gateway:8000']
    metrics_path: /metrics
    scrape_interval: 10s

  # LLM Gateway metrics (if exposed)
  - job_name: 'llm-gateway'
    static_configs:
      - targets: ['llm_gateway:8000']
    metrics_path: /metrics
    scrape_interval: 10s

  # Redis metrics (via redis_exporter if added)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # PostgreSQL metrics (via postgres_exporter if added)
