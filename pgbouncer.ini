[databases]
betterbooks = host=postgres port=5432 dbname=betterbooks user=betterbooks password=betterbooks

[pgbouncer]
listen_port = 6432
listen_addr = *
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Connection pool settings
pool_mode = transaction
max_client_conn = 300
default_pool_size = 25
reserve_pool_size = 10
max_db_connections = 100

# Server configuration
server_reset_query = DISCARD ALL
server_check_delay = 30
server_check_query = SELECT 1

# Client configuration
client_idle_timeout = 0
server_idle_timeout = 600

# Logging
admin_users = betterbooks
stats_users = betterbooks
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

# Security
ignore_startup_parameters = extra_float_digits

# Performance tuning
tcp_keepalive = 1
tcp_keepcnt = 3
tcp_keepidle = 600
tcp_keepintvl = 30

# Memory settings
pkt_buf = 4096
listen_backlog = 128